<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>StudyMate</title>
  <meta name="theme-color" content="#07131c" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Crect%20width%3D%2232%22%20height%3D%2232%22%20rx%3D%228%22%20fill%3D%22%2307131c%22%2F%3E%3Crect%20x%3D%228%22%20y%3D%226%22%20width%3D%2216%22%20height%3D%2220%22%20rx%3D%222.5%22%20fill%3D%22%234ec8f0%22%2F%3E%3Crect%20x%3D%2211%22%20y%3D%229%22%20width%3D%2210%22%20height%3D%2214%22%20rx%3D%221.2%22%20fill%3D%22%23e8f1f6%22%2F%3E%3Cpath%20d%3D%22M20%206v9l-2.2-1.6L15.6%2015V6z%22%20fill%3D%22%233dd6a3%22%2F%3E%3C%2Fsvg%3E" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" />
  <style>
    :root {
      --bg: #07131c; --surface: #0e1d2b; --hover: #163044; --fg: #e8f1f6;
      --muted: #8aa4b5; --primary: #4ec8f0; --primary-fg: #07131c;
      --secondary: #3dd6a3; --border: #1e3a4c; --success: #3dd6a3;
      --danger: #f07178; --warning: #e6b84d; --radius: 14px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      background: var(--bg);
      background-image:
        radial-gradient(ellipse 90% 50% at 0% -10%, color-mix(in oklab, var(--primary) 10%, transparent), transparent 55%),
        radial-gradient(circle at 1px 1px, color-mix(in oklab, var(--fg) 5%, transparent) 1px, transparent 0);
      background-size: auto, 22px 22px;
      color: var(--fg); font-family: Figtree, system-ui, sans-serif; line-height: 1.55;
    }
    button, [role="button"] { cursor: pointer; font-family: inherit; }
    h1,h2,h3 { font-family: Syne, Figtree, sans-serif; letter-spacing: -0.03em; line-height: 1.15; }
    .layout { display: flex; min-height: 100vh; max-width: 1100px; margin: 0 auto; }
    aside { width: 220px; flex-shrink: 0; padding: 28px 18px; border-right: 1px solid var(--border); }
    .brand { display: flex; gap: 10px; align-items: center; font-family: Syne, sans-serif; font-weight: 800; font-size: 1.25rem; }
    .brand span { color: var(--primary); }
    .kicker { font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); margin-top: 4px; }
    nav { display: flex; flex-direction: column; gap: 4px; margin-top: 28px; }
    .navbtn { height: 44px; border: 1px solid transparent; background: transparent; color: var(--muted); border-radius: 8px; text-align: left; padding: 0 12px; font-weight: 600; }
    .navbtn.on { background: var(--primary); color: var(--primary-fg); border-color: var(--primary); }
    .navbtn:hover:not(.on) { background: var(--hover); color: var(--fg); }
    main { flex: 1; min-width: 0; padding: 28px 24px; }
    .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 24px; padding: 24px; }
    .muted { color: var(--muted); }
    .row { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip, select, input[type="text"], input[type="number"], input:not([type="range"]):not([type="checkbox"]):not([type="radio"]) {
      height: 44px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--fg); padding: 0 12px; font: inherit;
    }
    .chip { display: inline-flex; align-items: center; font-size: 12px; font-weight: 700; border-radius: 999px; }
    .chip.on { background: var(--primary); color: var(--primary-fg); border-color: var(--primary); }
    .btn { height: 44px; border-radius: 8px; border: 1px solid var(--border); background: var(--hover); color: var(--fg); padding: 0 16px; font-weight: 600; }
    .btn.primary { background: var(--secondary); color: var(--primary-fg); border-color: var(--secondary); }
    .btn.ghost { background: transparent; color: var(--muted); }
    .grid2 { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
    .card { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; text-align: left; color: inherit; width: 100%; }
    .card:hover { border-color: var(--primary); }
    .listbtn { display: block; width: 100%; text-align: left; border: 1px solid var(--border); background: var(--bg); color: var(--muted); border-radius: 8px; padding: 12px 14px; margin-bottom: 8px; }
    .listbtn.on { border-color: var(--primary); background: color-mix(in oklab, var(--primary) 15%, transparent); color: var(--fg); }
    .notes { display: grid; gap: 20px; grid-template-columns: 220px 1fr; }
    .mcq { display: block; width: 100%; text-align: left; border: 1px solid var(--border); background: var(--hover); color: var(--fg); border-radius: 8px; padding: 12px 14px; margin: 6px 0; font-weight: 600; }
    .mcq.sel { border-color: var(--primary); background: color-mix(in oklab, var(--primary) 15%, transparent); }
    .mcq.good { background: var(--success); color: var(--primary-fg); border-color: var(--success); }
    .mcq.bad { background: var(--danger); color: var(--primary-fg); border-color: var(--danger); }
    .fact { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 12px; }
    .fact b { font-family: ui-monospace, monospace; color: var(--primary); font-size: 1.1rem; }
    label.field { display: block; font-size: 12px; color: var(--muted); font-weight: 600; }
    input[type="range"] { width: 100%; accent-color: var(--primary); }
    .spec { display: flex; overflow: hidden; border-radius: 12px; border: 1px solid var(--border); }
    .spec button { flex: 1; height: 64px; border: 0; color: #fff; font-weight: 700; font-size: 11px; }
    .topbar { display: none; }
    @media (max-width: 900px) {
      .layout { display: block; }
      aside { display: none; }
      .topbar { display: block; position: sticky; top: 0; z-index: 20; background: color-mix(in oklab, var(--bg) 90%, transparent); backdrop-filter: blur(10px); padding: 12px 16px; border-bottom: 1px solid var(--border); }
      .topnav { display: flex; gap: 4px; overflow-x: auto; margin-top: 10px; }
      .topnav .navbtn { flex-shrink: 0; height: 40px; }
      main { padding: 16px; }
      .notes { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="brand">Study<span>Mate</span></div>
    <div class="kicker">Year 9 science</div>
    <div class="topnav" id="topnav"></div>
  </div>
  <div class="layout">
    <aside>
      <div class="brand">Study<span>Mate</span></div>
      <div class="kicker">Year 9 science</div>
      <p class="muted" style="font-size:12px;margin-top:12px">Notes, labs and drills from your class packs.</p>
      <nav id="sidenav"></nav>
      <p class="muted" style="font-size:12px;margin-top:32px" id="counts"></p>
    </aside>
    <main><div class="panel" id="root"></div></main>
  </div>
  <script>
  window.STUDYMATE = {"qBank":[{"cat":"physics","type":"mcq","q":"Heat is defined as energy transferred due to a difference in:","options":["Density","Temperature","Volume"],"a":"Temperature"},{"cat":"physics","type":"text","q":"What is the standard unit of measurement for energy?","a":"joules"},{"cat":"physics","type":"mcq","q":"Which method of heat transfer involves the movement of fluids (liquids/gases)?","options":["Conduction","Convection","Radiation"],"a":"Convection"},{"cat":"physics","type":"mcq","q":"Which method of heat transfer can occur in a vacuum?","options":["Conduction","Convection","Radiation"],"a":"Radiation"},{"cat":"physics","type":"mcq","q":"According to the particle model, why are metals good conductors?","options":["They trap air","Particles vibrate and pass energy quickly","They absorb light"],"a":"Particles vibrate and pass energy quickly"},{"cat":"physics","type":"mcq","q":"Why are plastics considered good insulators?","options":["They have free electrons","Their particles restrict the flow of heat/vibrations","They reflect radiation"],"a":"Their particles restrict the flow of heat/vibrations"},{"cat":"physics","type":"mcq","q":"Static electricity is _____ charge, while current electricity is _____ charge.","options":["moving; stationary","stationary; moving"],"a":"stationary; moving"},{"cat":"physics","type":"mcq","q":"How should an ammeter and voltmeter be connected in a circuit?","options":["Both in series","Ammeter in series, Voltmeter in parallel","Ammeter in parallel, Voltmeter in series"],"a":"Ammeter in series, Voltmeter in parallel"},{"cat":"physics","type":"text","q":"According to the law of reflection, the angle of incidence equals the angle of _____.","a":"reflection"},{"cat":"physics","type":"mcq","q":"Why can light travel through space (a vacuum) but sound cannot?","options":["Light is an electromagnetic wave; sound needs particles","Sound is too heavy","Light waves are longitudinal"],"a":"Light is an electromagnetic wave; sound needs particles"},{"cat":"physics","type":"mcq","q":"In a longitudinal sound wave, the areas where particles are spread apart are called:","options":["Compressions","Rarefactions","Amplitudes"],"a":"Rarefactions"},{"cat":"physics","type":"mcq","q":"Sound travels fastest through:","options":["Solids","Liquids","Gases"],"a":"Solids"},{"cat":"physics","type":"mcq","q":"A higher frequency sound wave creates a:","options":["Louder sound","Higher pitch","Lower pitch"],"a":"Higher pitch"},{"cat":"physics","type":"text","q":"To calculate frequency, use the formula f = v / λ. What does λ (lambda) stand for?","a":"wavelength"},{"cat":"physics","type":"mcq","q":"What does a convex lens do to light rays?","options":["Diverges (spreads) them","Converges (focuses) them","Reflects them completely"],"a":"Converges (focuses) them"},{"cat":"reproduction","type":"text","q":"What term describes reproduction involving only one parent creating identical offspring?","a":"asexual"},{"cat":"reproduction","type":"mcq","q":"Runners and bulbs are examples of which asexual strategy?","options":["Binary fission","Budding","Vegetative propagation"],"a":"Vegetative propagation"},{"cat":"reproduction","type":"mcq","q":"Asexual reproduction occurs predominantly in:","options":["Mammals","Non-flowering plants, protists, bacteria","Reptiles"],"a":"Non-flowering plants, protists, bacteria"},{"cat":"reproduction","type":"text","q":"In sexual reproduction, what are the sex cells (sperm and egg) scientifically called?","a":"gametes"},{"cat":"reproduction","type":"mcq","q":"Sexual reproduction creates offspring with what percentage of genetic info from each parent?","options":["100%","75%","50%"],"a":"50%"},{"cat":"reproduction","type":"mcq","q":"Fertilisation can occur internally or externally. This adaptation often depends on the organism's:","options":["Diet","Environment/Habitat","Age"],"a":"Environment/Habitat"},{"cat":"reproduction","type":"mcq","q":"Compared to asexual reproduction, sexual reproduction is:","options":["Faster but less genetic variation","Slower but creates a greater rate of variation"],"a":"Slower but creates a greater rate of variation"},{"cat":"chemistry","type":"text","q":"What is the basic unit of matter?","a":"atom"},{"cat":"chemistry","type":"mcq","q":"Which subatomic particles are found in the nucleus?","options":["Protons and Electrons","Protons and Neutrons","Neutrons and Electrons"],"a":"Protons and Neutrons"},{"cat":"chemistry","type":"mcq","q":"The atomic number of an element is exactly equal to its number of:","options":["Neutrons","Protons","Valence electrons"],"a":"Protons"},{"cat":"chemistry","type":"mcq","q":"How do you calculate the number of neutrons?","options":["Mass number + Atomic number","Mass number - Atomic number","It equals the atomic number"],"a":"Mass number - Atomic number"},{"cat":"chemistry","type":"text","q":"Atoms are electrically neutral because they have equal numbers of protons and _____.","a":"electrons"},{"cat":"chemistry","type":"mcq","q":"On the periodic table, rows are called _____ and columns are called _____.","options":["Groups; Periods","Periods; Groups","Metals; Non-metals"],"a":"Periods; Groups"},{"cat":"chemistry","type":"mcq","q":"Elements in the same group (column) have:","options":["The same mass","Similar chemical properties","The same number of protons"],"a":"Similar chemical properties"},{"cat":"chemistry","type":"mcq","q":"What is the correct electron configuration for Calcium (Atomic No. 20)?","options":["2, 8, 10","2, 8, 8, 2","2, 18"],"a":"2, 8, 8, 2"},{"cat":"chemistry","type":"text","q":"What are the electrons in the outermost shell called?","a":"valence"},{"cat":"chemistry","type":"mcq","q":"When metals lose electrons, they form positive ions called:","options":["Anions","Cations","Isotopes"],"a":"Cations"},{"cat":"chemistry","type":"mcq","q":"In the equation 2Mg + O2 → 2MgO, what are the reactants?","options":["2MgO","Mg and O2","Only Mg"],"a":"Mg and O2"},{"cat":"chemistry","type":"mcq","q":"The state symbol (aq) means:","options":["Solid","Liquid","Aqueous (dissolved in water)"],"a":"Aqueous (dissolved in water)"},{"cat":"chemistry","type":"mcq","q":"When balancing a chemical equation, you can only change the:","options":["Coefficients (large numbers in front)","Subscripts (small numbers)","Formulas"],"a":"Coefficients (large numbers in front)"},{"cat":"chemistry","type":"mcq","q":"Reactions that absorb energy from the surroundings are:","options":["Exothermic","Endothermic","Neutral"],"a":"Endothermic"},{"cat":"chemistry","type":"mcq","q":"The Law of Conservation of Mass states that atoms are:","options":["Created during reactions","Rearranged, not created or destroyed","Destroyed when burned"],"a":"Rearranged, not created or destroyed"},{"cat":"carbon","type":"text","q":"Carbon continually moves through the atmosphere, hydrosphere, lithosphere, and _____.","a":"biosphere"},{"cat":"carbon","type":"mcq","q":"Photosynthesis and cellular respiration are linked because:","options":["They both release oxygen","The products of one are the reactants of the other","They both happen in the dark"],"a":"The products of one are the reactants of the other"},{"cat":"carbon","type":"mcq","q":"What is the word equation for photosynthesis?","options":["glucose + oxygen → carbon dioxide + water","carbon dioxide + water → glucose + oxygen"],"a":"carbon dioxide + water → glucose + oxygen"},{"cat":"carbon","type":"mcq","q":"Cellular respiration releases carbon dioxide back into the:","options":["Lithosphere","Atmosphere","Hydrosphere"],"a":"Atmosphere"},{"cat":"carbon","type":"mcq","q":"Dead organisms return carbon to the Earth via:","options":["Combustion","Lithification and Decomposition","Respiration"],"a":"Lithification and Decomposition"},{"cat":"carbon","type":"mcq","q":"Which human activity is the primary cause of increasing atmospheric carbon dioxide?","options":["Planting trees","Burning fossil fuels","Building dams"],"a":"Burning fossil fuels"},{"cat":"body","type":"mcq","q":"The Central Nervous System (CNS) consists of the:","options":["Brain and spinal cord","All nerves in the limbs","Heart and lungs"],"a":"Brain and spinal cord"},{"cat":"body","type":"mcq","q":"Which part of a neuron receives incoming messages?","options":["Axon","Myelin Sheath","Dendrite"],"a":"Dendrite"},{"cat":"body","type":"text","q":"What detects stimuli in the nervous system (e.g., light, heat, pressure)?","a":"receptors"},{"cat":"body","type":"mcq","q":"How does a message travel along a single neuron?","options":["As a chemical hormone","As an electrical impulse","Through the blood"],"a":"As an electrical impulse"},{"cat":"body","type":"mcq","q":"What is the correct pathway for a stimulus-response model?","options":["Stimulus → Receptor → Control Centre → Effector → Response","Receptor → Stimulus → Effector → Response"],"a":"Stimulus → Receptor → Control Centre → Effector → Response"},{"cat":"body","type":"mcq","q":"Compared to the nervous system, the endocrine system is:","options":["Faster and short-lasting","Slower and longer-lasting","Uses electrical impulses"],"a":"Slower and longer-lasting"},{"cat":"body","type":"mcq","q":"How do hormones travel to their target cells?","options":["Through nerves","Through the bloodstream","Through digestion"],"a":"Through the bloodstream"},{"cat":"body","type":"text","q":"What is the scientific term for the body maintaining a stable internal environment?","a":"homeostasis"},{"cat":"body","type":"mcq","q":"When body temperature rises, sweating cools you down. This is an example of a:","options":["Positive feedback loop","Negative feedback loop","Nervous breakdown"],"a":"Negative feedback loop"},{"cat":"energy","type":"mcq","q":"In the particle model, what happens to particles when a substance is heated?","options":["They usually gain kinetic energy and move or vibrate more","They disappear","They become a different element"],"a":"They usually gain kinetic energy and move or vibrate more","source":"Energy and Particle Model"},{"cat":"energy","type":"mcq","q":"Which two broad types of energy were contrasted in the particle-model recap?","options":["Kinetic and potential","Electrical and magnetic","Light and sound"],"a":"Kinetic and potential","source":"Energy and Particle Model"},{"cat":"energy","type":"text","q":"What is the name of the model that describes matter as made of tiny particles?","a":"particle model","source":"Energy and Particle Model"},{"cat":"energy","type":"mcq","q":"In the particle model, particles in a solid are best described as:","options":["Close together and vibrating in place","Very far apart and moving freely","Not moving at all"],"a":"Close together and vibrating in place","source":"Energy and Particle Model"},{"cat":"energy","type":"mcq","q":"In the particle model, particles in a gas are generally:","options":["Far apart and able to move freely","Locked into fixed positions","Packed as tightly as in a solid"],"a":"Far apart and able to move freely","source":"Energy and Particle Model"},{"cat":"energy","type":"mcq","q":"When a substance changes state, what is happening to its particles?","options":["Their arrangement and movement change","The particles are destroyed","The number of protons changes"],"a":"Their arrangement and movement change","source":"Energy and Particle Model"},{"cat":"energy","type":"text","q":"What kind of energy is associated with particle motion?","a":"kinetic energy","source":"Energy and Particle Model"},{"cat":"energy","type":"mcq","q":"A change in the movement of particles is linked most directly to a change in their:","options":["Kinetic energy","Atomic number","Colour"],"a":"Kinetic energy","source":"Energy and Particle Model"},{"cat":"heat","type":"text","q":"What is temperature a measure of in the particle model?","a":"average kinetic energy","source":"Heat, Temperature and Conduction"},{"cat":"heat","type":"mcq","q":"Which unit is used to measure heat as energy?","options":["Joules","Degrees Celsius","Amps"],"a":"Joules","source":"Heat, Temperature and Conduction"},{"cat":"heat","type":"mcq","q":"Heat transfer occurs when there is a difference in:","options":["Temperature","Colour","Mass only"],"a":"Temperature","source":"Heat, Temperature and Conduction"},{"cat":"heat","type":"mcq","q":"Thermal energy transfers naturally from:","options":["Higher temperature to lower temperature","Lower temperature to higher temperature","Cold objects to hot objects only"],"a":"Higher temperature to lower temperature","source":"Heat, Temperature and Conduction"},{"cat":"heat","type":"mcq","q":"Which heat-transfer method mainly involves particles vibrating in place and passing energy to neighbouring particles?","options":["Conduction","Convection","Radiation"],"a":"Conduction","source":"Heat, Temperature and Conduction"},{"cat":"heat","type":"mcq","q":"Which heat-transfer method occurs in liquids and gases through the movement of the heated substance?","options":["Convection","Conduction","Reflection"],"a":"Convection","source":"Heat, Temperature and Conduction"},{"cat":"heat","type":"mcq","q":"Which heat-transfer method can occur through a vacuum?","options":["Radiation","Convection","Conduction only"],"a":"Radiation","source":"Heat Transfer: Radiation"},{"cat":"heat","type":"mcq","q":"During conduction, hotter particles transfer energy to cooler particles mainly through:","options":["Collisions","Gravity","Chemical reactions"],"a":"Collisions","source":"Heat, Temperature and Conduction"},{"cat":"heat","type":"mcq","q":"Why do metals conduct heat efficiently according to the supplied notes?","options":["Their outer electrons are free to move and can transfer kinetic energy","They contain trapped air","Their particles never vibrate"],"a":"Their outer electrons are free to move and can transfer kinetic energy","source":"Heat, Temperature and Conduction"},{"cat":"heat","type":"mcq","q":"Which is identified in the supplied notes as a heat insulator?","options":["Plastic","Copper","Metal"],"a":"Plastic","source":"Heat, Temperature and Conduction"},{"cat":"heat","type":"mcq","q":"Why is trapped air useful in many insulators?","options":["Air is a poor conductor of heat","Air is an excellent conductor of heat","Air stops particles existing"],"a":"Air is a poor conductor of heat","source":"Heat, Temperature and Conduction"},{"cat":"heat","type":"mcq","q":"In convection, warm fluid tends to rise because it becomes:","options":["Less dense","More dense","Solid"],"a":"Less dense","source":"Heat Transfer: Convection"},{"cat":"heat","type":"mcq","q":"In a convection current, cooler, denser fluid tends to:","options":["Sink","Rise","Disappear"],"a":"Sink","source":"Heat Transfer: Convection"},{"cat":"heat","type":"text","q":"What is the term for heat transfer by electromagnetic waves?","a":"radiation","source":"Heat Transfer: Radiation"},{"cat":"heat","type":"mcq","q":"Infrared radiation is a type of:","options":["Electromagnetic wave","Sound wave","Water wave"],"a":"Electromagnetic wave","source":"Heat Transfer: Radiation"},{"cat":"heat","type":"mcq","q":"According to the supplied radiation notes, dark surfaces are generally good at:","options":["Absorbing and emitting thermal radiation","Only transmitting radiation","Preventing all radiation"],"a":"Absorbing and emitting thermal radiation","source":"Heat Transfer: Radiation"},{"cat":"heat","type":"mcq","q":"A shiny, reflective surface tends to:","options":["Reflect more infrared radiation","Absorb all infrared radiation","Turn infrared into sound"],"a":"Reflect more infrared radiation","source":"Heat Transfer: Radiation"},{"cat":"heat","type":"mcq","q":"Which situation is the clearest example of radiation?","options":["Warming your hands near a campfire","A metal spoon heating along its length","Water circulating as it boils"],"a":"Warming your hands near a campfire","source":"2026 Energy Transfer Feedback"},{"cat":"heat","type":"mcq","q":"A plastic handle on a metal cooking utensil is mainly used to:","options":["Reduce heat transfer to your hand","Increase conduction to your hand","Make the metal hotter"],"a":"Reduce heat transfer to your hand","source":"2026 Energy Transfer Feedback"},{"cat":"heat","type":"mcq","q":"Which sequence correctly names the three main methods of heat transfer taught in the supplied material?","options":["Conduction, convection, radiation","Reflection, refraction, diffraction","Current, voltage, resistance"],"a":"Conduction, convection, radiation","source":"Heat Transfer lessons"},{"cat":"heat","type":"mcq","q":"In the supplied insulation investigation, what was being investigated?","options":["How insulation affects heat transfer","How sound travels through solids","How voltage changes in parallel circuits"],"a":"How insulation affects heat transfer","source":"Y9 Insulation Investigation 2026"},{"cat":"sound","type":"text","q":"What creates a sound wave according to the supplied notes?","a":"vibration","source":"Introduction to Sound"},{"cat":"sound","type":"mcq","q":"Sound requires what to travel through?","options":["A medium","A vacuum only","No matter at all"],"a":"A medium","source":"Introduction to Sound"},{"cat":"sound","type":"mcq","q":"Sound is described in the supplied material as a transfer of kinetic energy via:","options":["Mechanical longitudinal waves","Electromagnetic transverse waves","Light rays"],"a":"Mechanical longitudinal waves","source":"Introduction to Sound"},{"cat":"sound","type":"mcq","q":"In a longitudinal sound wave, particles move:","options":["Backwards and forwards parallel to the direction of wave motion","Only upwards","At 90° to the wave direction"],"a":"Backwards and forwards parallel to the direction of wave motion","source":"Introduction to Sound"},{"cat":"sound","type":"text","q":"What are the compressed regions of a longitudinal sound wave called?","a":"compressions","source":"Introduction to Sound"},{"cat":"sound","type":"text","q":"What are the spread-out regions of a longitudinal sound wave called?","a":"rarefactions","source":"Introduction to Sound"},{"cat":"sound","type":"mcq","q":"Which property of a sound wave is linked to loudness?","options":["Amplitude","Frequency","Wavelength only"],"a":"Amplitude","source":"Introduction to Sound"},{"cat":"sound","type":"mcq","q":"A larger amplitude produces a sound that is generally:","options":["Louder","Higher pitched","Slower"],"a":"Louder","source":"Introduction to Sound"},{"cat":"sound","type":"mcq","q":"Which property of a sound wave is linked to pitch?","options":["Frequency","Amplitude","Density"],"a":"Frequency","source":"Introduction to Sound"},{"cat":"sound","type":"mcq","q":"A higher frequency produces a sound with a:","options":["Higher pitch","Lower pitch","Lower amplitude automatically"],"a":"Higher pitch","source":"Introduction to Sound"},{"cat":"sound","type":"mcq","q":"Why does sound generally travel faster through a solid than through a gas?","options":["The particles in a solid are closer together, so vibrations are passed on more quickly","Sound becomes electromagnetic in a solid","Solids have no particles"],"a":"The particles in a solid are closer together, so vibrations are passed on more quickly","source":"Sound and Particles worksheet"},{"cat":"sound","type":"mcq","q":"Which type of wave can travel through a vacuum?","options":["Electromagnetic radiation","Sound","Any mechanical wave"],"a":"Electromagnetic radiation","source":"Introduction to Sound / Energy Transfer assessment"},{"cat":"sound","type":"mcq","q":"If a sound wave has the same frequency but a greater amplitude, it will sound:","options":["Louder but with the same pitch","Higher pitched but equally loud","Quieter and lower pitched"],"a":"Louder but with the same pitch","source":"Sound and Particles worksheet"},{"cat":"sound","type":"mcq","q":"If a sound wave has the same amplitude but a greater frequency, it will sound:","options":["Higher pitched but with the same loudness","Louder but the same pitch","Quieter and lower pitched"],"a":"Higher pitched but with the same loudness","source":"Sound and Particles worksheet"},{"cat":"sound","type":"mcq","q":"A sound with many vibrations passing a point each second has a high:","options":["Frequency","Amplitude","Density"],"a":"Frequency","source":"Sound and Particles worksheet"},{"cat":"sound","type":"mcq","q":"What happens to a particle as a sound vibration is passed through a material?","options":["It vibrates and transfers the disturbance to neighbouring particles","It becomes light","It stops existing"],"a":"It vibrates and transfers the disturbance to neighbouring particles","source":"Sound and Particles worksheet"},{"cat":"electricity","type":"text","q":"What is the flow of electrons around a connected circuit called?","a":"electric current","source":"Year 9 Electricity"},{"cat":"electricity","type":"text","q":"What unit is used to measure current?","a":"amps","source":"Year 9 Electricity"},{"cat":"electricity","type":"text","q":"What unit is used to measure voltage?","a":"volts","source":"Year 9 Electricity"},{"cat":"electricity","type":"mcq","q":"Which device measures current?","options":["Ammeter","Voltmeter","Thermometer"],"a":"Ammeter","source":"Year 9 Electricity"},{"cat":"electricity","type":"mcq","q":"Which device measures voltage?","options":["Voltmeter","Ammeter","Barometer"],"a":"Voltmeter","source":"Voltage in Series and Parallel circuits"},{"cat":"electricity","type":"mcq","q":"How is a voltmeter connected when measuring the voltage across a component?","options":["In parallel, or across the component","In series with the whole circuit only","Outside the circuit"],"a":"In parallel, or across the component","source":"Voltage in Series and Parallel circuits"},{"cat":"electricity","type":"mcq","q":"In a series circuit, the current is:","options":["The same at any point in the circuit","Always zero","Different at every point"],"a":"The same at any point in the circuit","source":"Voltage in Series and Parallel circuits"},{"  are interneurons located according to the supplied material?","options":["CNS, including the brain and spinal cord","Skin","Muscles only","Endocrine glands"],"a":"CNS, including the brain and spinal cord"},{"cat":"body","type":"mcq","q":"What is a neurotransmitter?","options":["A chemical messenger that carries a message across a synapse","A fatty layer around an axon","A gland","A sensory organ"],"a":"A chemical messenger that carries a message across a synapse"},{"cat":"body","type":"mcq","q":"What is a reflex?","options":["A fast automatic response that helps protect the body from harm","A slow conscious decision","A hormone released by the pancreas","A type of endocrine gland"],"a":"A fast automatic response that helps protect the body from harm"},{"cat":"body","type":"mcq","q":"What is the sequence in the reflex arc described in the supplied material?","options":["Stimulus → receptor → sensory neuron → spinal cord/interneuron → motor neuron → effector","Stimulus → motor neuron → receptor → brain → effector","Receptor → stimulus → motor neuron → sensory neuron","Stimulus → hormone → receptor → muscle"],"a":"Stimulus → receptor → sensory neuron → spinal cord/interneuron → motor neuron → effector"},{"cat":"body","type":"mcq","q":"Which receptor detects visible light?","options":["Photoreceptor","Thermoreceptor","Mechanoreceptor","Chemoreceptor"],"a":"Photoreceptor"},{"cat":"body","type":"mcq","q":"Which receptor detects changes in temperature?","options":["Thermoreceptor","Photoreceptor","Nociceptor","Chemoreceptor"],"a":"Thermoreceptor"},{"cat":"body","type":"mcq","q":"Which receptor detects chemicals in food and the environment?","options":["Chemoreceptor","Mechanoreceptor","Photoreceptor","Nociceptor"],"a":"Chemoreceptor"},{"cat":"body","type":"mcq","q":"Which receptor detects pain?","options":["Nociceptor","Photoreceptor","Thermoreceptor","Chemoreceptor"],"a":"Nociceptor"},{"cat":"body","type":"mcq","q":"Where are sound and balance mechanoreceptors located?", nvironment?","a":["homeostasis"]},{"cat":"body","type":"text","q":"What is the name for the fatty tissue surrounding an axon that acts as an insulator?","a":["myelin","myelin sheath"]},{"cat":"body","type":"text","q":"What chemical messenger crosses a synapse?","a":["neurotransmitter","neurotransmitter chemical"]},{"cat":"body","type":"text","q":"What hormone lowers blood glucose?","a":["insulin"]},{"cat":"body","type":"text","q":"What hormone raises blood glucose when it is low?","a":["glucagon"]},{"cat":"body","type":"text","q":"What hormone regulates blood water levels according to the supplied material?","a":["ADH","anti-diuretic hormone","antidiuretic hormone"]},{"cat":"carbon","type":"mcq","q":"Which four Earth spheres are named in the supplied carbon-cycle material?","options":["Atmosphere, hydrosphere, biosphere and geosphere","Atmosphere, mantle, core and crust","Biosphere, ionosphere, magnetosphere and core","Hydrosphere, stratosphere, thermosphere and core"],"a":"Atmosphere, hydrosphere, biosphere and geosphere"},{"cat":"carbon","type":"mcq","q":"Which process uses carbon dioxide and water in the presence of light to make glucose and release oxygen?","options":["Photosynthesis","Cellular respiration","Decomposition","Combustion"],"a":"Photosynthesis"},{"cat":"carbon","type":"mcq","q":"Where does photosynthesis occur in plant cells?","options":["Chloroplasts","Mitochondria","Nucleus","Ribosomes"],"a":"Chloroplasts"},{"cat":"carbon","type":"mcq","q":"What are the reactants of photosynthesis in the supplied material?","options":["Carbon dioxide and water","Glucose and oxygen","Carbon dioxide and oxygen","Glucose and water"],"a":"Carbon dioxide and water"},{"cat":"carbon","type":"mcq","q":"What are the products of photosynthesis in the supplied material?","options":["Glucose and oxygen","Carbon dioxide and water","ATP and carbon dioxide","Methane and oxygen"],"a":"Glucose and oxygen"},{"cat":"carbon","type":"mcq","q":"What are stomata used for?","options":["Gas exchange into and out of the plant","Making glucose directly","Transporting blood","Storing fossil fuels"],"a":"Gas exchange into and out of the plant"},{"cat":"carbon","type":"mcq","q":"What type of reaction is photosynthesis described as?","options":["Endothermic","Exothermic","Neutral","Combustion"],"a":"Endothermic"},{"cat":"carbon","type":"mcq","q":"Where does cellular respiration occur?","options":["Mitochondria","Chloroplasts","Cell wall","Nucleus"],"a":"Mitochondria"},{"cat":"carbon","type":"mcq","q":"Which organisms carry out cellular respiration according to the supplied material?","options":["All living organisms","Only animals","Only plants","Only fungi"],"a":"All living organisms"},{"cat":"carbon","type":"mcq","q":"What are the reactants of cellular respiration?","options":["Glucose and oxygen","Carbon dioxide and water","Glucose and carbon dioxide","Oxygen and water"],"a":"Glucose and oxygen"},{"cat":"carbon","type":"mcq","q":"What are the products of cellular respiration?","options":["Carbon dioxide, water and ATP/energy","Glucose and oxygen","Carbon monoxide and soot","Only oxygen"],"a":"Carbon dioxide, water and ATP/energy"},{"cat":"carbon","type":"mcq","q":"What type of reaction is cellular respiration described as?","options":["Exothermic","Endothermic","Neutral","Photosynthetic"],"a":"Exothermic"},{"cat":"carbon","type":"mcq","q":"How are photosynthesis and cellular respiration linked?","options":["The products of one are the reactants of the other","They use exactly the same reactants and products","Neither involves carbon","Both only occur in plants"],"a":"The products of one are the reactants of the other"},{"cat":"carbon","type":"mcq","q":"What happens during decomposition?","options":["Decomposers break dead organisms into simpler matter","Plants turn oxygen into glucose","Rocks turn into animals","Fossil fuels instantly form"],"a":"Decomposers break dead organisms into simpler matter"},{"cat":"carbon","type":"mcq","q":"Which are listed a ns":["Position","Movement","Chemical bonds"],"a":"Movement","source":"Energy transfers and transformations 2025"},{"cat":"energy","type":"mcq","q":"Gravitational potential energy is stored because of an object's:","options":["Speed","Colour","Position in a gravitational field"],"a":"Position in a gravitational field","source":"Energy transfers and transformations 2025"},{"cat":"energy","type":"mcq","q":"A battery converting chemical energy into electrical energy is an example of:","options":["Energy destruction","An energy transformation","A nuclear reaction"],"a":"An energy transformation","source":"Energy transfers and transformations 2025"},{"cat":"energy","type":"mcq","q":"In the PhET energy systems sim, sunlight hitting a solar panel is mainly converted into:","options":["Sound energy","Electrical energy","Nuclear energy"],"a":"Electrical energy","source":"Energy Forms & Changes (PhET)"},{"cat":"energy","type":"mcq","q":"Why must the cyclist in the energy simulation be fed to keep pedalling?","options":["Food is needed as a chemical energy source","Food increases gravity","Food creates new energy from nothing"],"a":"Food is needed as a chemical energy source","source":"Energy Forms & Changes (PhET)"},{"cat":"energy","type":"mcq","q":"On a frictionless skate track, as the skater goes downhill, gravitational potential energy is mainly converted into:","options":["Chemical energy","Kinetic energy","Nuclear energy"],"a":"Kinetic energy","source":"Energy Skate Park Basics (PhET)"},{"cat":"energy","type":"mcq","q":"If a frictionless skater starts from rest at the top, where is kinetic energy greatest?","options":["At the highest point","At the lowest point","It is the same everywhere"],"a":"At the lowest point","source":"Energy Skate Park Basics (PhET)"},{"cat":"energy","type":"mcq","q":"Adding friction to a skate track causes some mechanical energy to become:","options":["Thermal energy","Nuclear energy","Chemical energy"],"a":"Thermal energy","source":"Energy Skate Park Basics (PhET)"},{"cat":"energy","type":"mcq","q":"On a Sankey diagram, the width of each arrow represents:","options":["Time taken","The amount of energy","Temperature"],"a":"The amount of energy","source":"Sankey Energy Diagrams"},{"cat":"energy","type":"mcq","q":"Why does the input arrow on a Sankey diagram equal the total width of the output arrows?","options":["Energy is conserved","Heat is ignored","Useful energy is always 50%"],"a":"Energy is conserved","source":"Sankey Energy Diagrams"},{"cat":"energy","type":"mcq","q":"In a typical Sankey diagram, arrows that continue to the right show:","options":["Wasted energy","Useful energy","Nuclear energy only"],"a":"Useful energy","source":"Sankey Energy Diagrams Worksheet"},{"cat":"energy","type":"mcq","q":"An old filament lamp uses 100 J of electrical energy and gives out 10 J of light. How much energy is wasted as heat?","options":["10 J","90 J","110 J"],"a":"90 J","source":"Sankey Energy Diagrams"},{"cat":"energy","type":"text","q":"Write the formula for energy efficiency as a percentage.","a":["efficiency = useful energy / input energy x 100","useful energy / input energy x 100","(useful / input) x 100"],"source":"Sankey Energy Diagrams"},{"cat":"energy","type":"mcq","q":"A vacuum cleaner takes in 1440 kJ and produces 430 kJ of useful motion. What is its efficiency (nearest whole number)?","options":["30%","70%","43%"],"a":"30%","source":"Sankey Energy Diagrams"},{"cat":"energy","type":"mcq","q":"A fluorescent bulb that turns 12 J of electrical energy into 6 J of light wastes how much heat energy?","options":["6 J","12 J","18 J"],"a":"6 J","source":"Sankey Energy Diagrams Worksheet"},{"cat":"energy","type":"mcq","q":"Work is done when a force causes an object to:","options":["Stay still","Be displaced","Change colour"],"a":"Be displaced","source":"Work, GPE & KE (Formulas)"},{"cat":"energy","type":"mcq","q":"A waiter carrying a tray at constant height across a room is not doing work on the tray because:","options":["There is no force","The force is not in the direction of the displacement","Gravity is switched off"],"a":"The force is not in the direction of the displacement","source":"Work, GPE & KE (Formulas)"},{"cat":"energy","type":"text","q":"Write the formula for work done.","a":["W = F x s","W = Fs","work = force x distance","work = force x displacement"],"source":"Work, GPE & KE (Formulas)"},{"cat":"energy","type":"mcq","q":"Robert pushes a car 50 m with a force of 1000 N. How much work has he done?","options":["1050 J","50 000 J","1000 J"],"a":"50 000 J","source":"Work, GPE & KE questions"},{"cat":"energy","type":"mcq","q":"Using g = 10 N/kg, how much GPE does a 5 kg cat gain when lifted 2 m?","options":["10 J","100 J","25 J"],"a":"100 J","source":"Work, GPE & KE questions"},{"cat":"energy","type":"text","q":"Write the formula for gravitational potential energy.","a":["Ep = mgh","GPE = mgh","Ep = m x g x h"],"source":"Work, GPE & KE (Formulas)"},{"cat":"energy","type":"text","q":"Write the formula for kinetic energy.","a":["Ek = 1/2 mv^2","KE = 1/2 mv^2","Ek = 0.5mv^2","KE = 1/2 x mass x velocity^2"],"source":"Work, GPE & KE (Formulas)"},{"cat":"energy","type":"mcq","q":"A 3 kg cat runs at 4 m/s. What is its kinetic energy?","options":["12 J","24 J","6 J"],"a":"24 J","source":"Work, GPE & KE (Formulas)"},{"cat":"energy","type":"mcq","q":"Mechanical energy is the sum of:","options":["Heat and light","Kinetic and potential energy","Work and power"],"a":"Kinetic and potential energy","source":"Work, GPE & KE (Formulas)"},{"cat":"energy","type":"mcq","q":"A 50 kg goat jumps from a 450 m cliff. Using g = 10 N/kg, what GPE does it lose?","options":["4500 J","225 000 J","50 J"],"a":"225 000 J","source":"Work, GPE & KE questions"},{"cat":"emspectrum","type":"mcq","q":"Which list is the electromagnetic spectrum in order of increasing frequency?","options":["Gamma, X-ray, UV, visible, IR, microwave, radio","Radio, microwave, infrared, visible, ultraviolet, X-ray, gamma","Radio, visible, microwave, X-ray, gamma, UV, infrared"],"a":"Radio, microwave, infrared, visible, ultraviolet, X-ray, gamma","source":"The Electromagnetic Spectrum"},{"cat":"emspectrum","type":"mcq","q":"All electromagnetic waves travel at the same speed in a vacuum, which is about:","options":["340 m/s","300 000 000 m/s","3 m/s"],"a":"300 000 000 m/s","source":"Light Booklet Year 9 2025"},{"cat":"emspectrum","type":"mcq","q":"Electromagnetic waves are:","options":["Longitudinal and need a medium","Transverse and can travel through a vacuum","Particles that cannot reflect"],"a":"Transverse and can travel through a vacuum","source":"Light Booklet Year 9 2025"},{"cat":"emspectrum","type":"text","q":"Write the wave equation relating speed, frequency and wavelength.","a":["v = f λ","v = f x λ","v = fλ","speed = frequency x wavelength"],"source":"Light Booklet Year 9 2025"},{"cat":"emspectrum","type":"mcq","q":"Shorter wavelength electromagnetic waves carry:","options":["Less energy","More energy","The same energy as radio waves"],"a":"More energy","source":"The Electromagnetic Spectrum"},{"cat":"emspectrum","type":"mcq","q":"Which EM waves have the longest wavelength?","options":["Gamma rays","X-rays","Radio waves"],"a":"Radio waves","source":"The Electromagnetic Spectrum"},{"cat":"emspectrum","type":"mcq","q":"Microwaves heat food mainly by:","options":["Making water molecules vibrate","Ionising the food","Turning food into plasma"],"a":"Making water molecules vibrate","source":"The Electromagnetic Spectrum"},{"cat":"emspectrum","type":"mcq","q":"Infrared radiation is commonly used for:","options":["Bone imaging","Thermal detection and heating","Killing all bacteria in a vacuum pack only"],"a":"Thermal detection and heating","source":"The Electromagnetic Spectrum"},{"cat":"emspectrum","type":"mcq","q":"The hotter an object is, the more infrared radiation it:","options":["Reflects only","Emits","Blocks"],"a":"Emits","source":"The Electromagnetic Spectrum"},{"cat":"emspectrum","type":"mcq","q":"Visible light wavelengths are about:","options":["390–780 nm","10–1000 m","0.001 nm"],"a":"390–780 nm","source":"Visible Light"},{"cat":"emspectrum","type":"mcq","q":"Red is always next to which part of the spectrum?","options":["Ultraviolet","Infrared","X-rays"],"a":"Infrared","source":"The Electromagnetic Spectrum"},{"cat":"emspectrum","type":"mcq","q":"Violet is always next to:","options":["Microwaves","Ultraviolet","Radio waves"],"a":"Ultraviolet","source":"The Electromagnetic Spectrum"},{"cat":"emspectrum","type":"mcq","q":"A benefit of some UV exposure is that skin can make:","options":["Vitamin D","Vitamin K","Insulin"],"a":"Vitamin D","source":"The Electromagnetic Spectrum"},{"cat":"emspectrum","type":"mcq","q":"Overexposure to UV radiation increases the risk of:","options":["Broken bones only","Skin cancer and premature ageing","Hearing loss"],"a":"Skin cancer and premature ageing","source":"The Electromagnetic Spectrum"},{"cat":"emspectrum","type":"mcq","q":"Chemicals that absorb UV and re-emit visible light are described as:","options":["Magnetic","Fluorescent","Opaque"],"a":"Fluorescent","source":"The Electromagnetic Spectrum"},{"cat":"emspectrum","type":"mcq","q":"X-rays are useful for imaging bones because they:","options":["Pass through soft tissue more easily than dense bone","Bounce off skin","Are stopped by air"],"a":"Pass through soft tissue more easily than dense bone","source":"The Electromagnetic Spectrum"},{"cat":"emspectrum","type":"mcq","q":"Radiographers wear lead aprons because lead is:","options":["A good source of X-rays","Dense enough to absorb X-rays","Transparent to gamma only"],"a":"Dense enough to absorb X-rays","source":"The Electromagnetic Spectrum"},{"cat":"emspectrum","type":"mcq","q":"Gamma rays are emitted by:","options":["Hot kettle coils only","Certain radioactive materials","Sound speakers"],"a":"Certain radioactive materials","source":"The Electromagnetic Spectrum"},{"cat":"emspectrum","type":"mcq","q":"Gamma rays are used to sterilise medical equipment because they:","options":["Are highly penetrating and kill living cells","Are stopped by paper","Heat water molecules only"],"a":"Are highly penetrating and kill living cells","source":"The Electromagnetic Spectrum"},{"cat":"emspectrum","type":"mcq","q":"Ionizing waves can damage living tissue by:","options":["Tickling nerve endings","Killing cells or damaging DNA","Only warming the skin slightly"],"a":"Killing cells or damaging DNA","source":"The Electromagnetic Spectrum"},{"cat":"light","type":"mcq","q":"Objects that give out their own light are called:","options":["Opaque","Luminous","Translucent"],"a":"Luminous","source":"Visible Light"},{"cat":"light","type":"mcq","q":"The Moon is non-luminous because we see it by:","options":["Light it produces itself","Reflected light","Sound waves"],"a":"Reflected light","source":"Visible Light"},{"cat":"light","type":"mcq","q":"A material that transmits light so details behind it can be seen clearly is:","options":["Transparent","Translucent","Opaque"],"a":"Transparent","source":"Visible Light"},{"cat":"light","type":"mcq","q":"Frosted glass is translucent because it:","options":["Blocks all light","Transmits some light but blurs detail","Emits its own light"],"a":"Transmits some light but blurs detail","source":"Visible Light"},{"cat":"light","type":"mcq","q":"We see objects because light travels:","options":["From our eyes to the object","From the object (or reflections) into our eyes","Around corners as a sound"],"a":"From the object (or reflections) into our eyes","source":"Visible Light"},{"cat":"light","type":"mcq","q":"The law of reflection states that the angle of incidence equals the:","options":["Critical angle","Angle of refraction","Angle of reflection"],"a":"Angle of reflection","source":"Reflection"},{"cat":"light","type":"mcq","q":"The normal is a line drawn:","options":["Parallel to the mirror","At 90° to the surface","Along the incident ray"],"a":"At 90° to the surface","source":"Reflection"},{"cat":"light","type":"mcq","q":"Smooth, shiny surfaces give:","options":["Diffuse reflection","Clear (specular) reflection","No reflection"],"a":"Clear (specular) reflection","source":"Reflection"},{"cat":"light","type":"mcq","q":"Diffuse reflection happens when light hits:","options":["A rough, dull surface and scatters","A vacuum","A perfectly flat mirror"],"a":"A rough, dull surface and scatters","source":"Reflection"},{"cat":"light","type":"mcq","q":"A concave mirror reflects parallel rays so they:","options":["Diverge as if from behind the mirror","Meet at a focal point","Stop reflecting"],"a":"Meet at a focal point","source":"Light Booklet Year 9 2025"},{"cat":"light","type":"mcq","q":"Convex mirrors are used in shops because they:","options":["Give a wide field of view","Make everything look larger and closer only","Produce real inverted images on a screen always"],"a":"Give a wide field of view","source":"Light Booklet Year 9 2025"},{"cat":"light","type":"mcq","q":"Refraction is the bending of light because:","options":["Light is absorbed","The speed of light changes in different materials","Mirrors are curved"],"a":"The speed of light changes in different materials","source":"Refraction"},{"cat":"light","type":"mcq","q":"When light travels from air into glass (more dense), it:","options":["Speeds up and bends away from the normal","Slows down and bends towards the normal","Stops"],"a":"Slows down and bends towards the normal","source":"Refraction"},{"cat":"light","type":"mcq","q":"When light travels from water into air it:","options":["Speeds up and bends away from the normal","Slows down and bends towards the normal","Cannot leave the water"],"a":"Speeds up and bends away from the normal","source":"Refraction"},{"cat":"light","type":"mcq","q":"A pencil in a glass of water looks bent because:","options":["The pencil actually snaps","Light from the underwater part is refracted","Water is opaque"],"a":"Light from the underwater part is refracted","source":"Refraction"},{"cat":"light","type":"mcq","q":"Total internal reflection can occur when light is travelling:","options":["From a less dense medium into a more dense medium","From a more dense medium towards a less dense medium at or above the critical angle","Through a vacuum only"],"a":"From a more dense medium towards a less dense medium at or above the critical angle","source":"Light Booklet Year 9 2025"},{"cat":"light","type":"mcq","q":"A convex (converging) lens is thicker in the middle and can:","options":["Only make images smaller","Bring parallel rays to a focus","Always scatter light randomly"],"a":"Bring parallel rays to a focus","source":"Light Booklet Year 9 2025"},{"cat":"light","type":"mcq","q":"White light is split into colours by a prism because different colours:","options":["Have the same wavelength","Slow by different amounts","Are absorbed equally"],"a":"Slow by different amounts","source":"Colour Powerpoint"},{"cat":"light","type":"text","q":"Write the order of rainbow colours from red to violet (ROYGBIV).","a":["red orange yellow green blue indigo violet","roygbiv","red, orange, yellow, green, blue, indigo, violet"],"source":"Light Booklet Year 9 2025"},{"cat":"light","type":"mcq","q":"In a prism, which colour is refracted the least?","options":["Violet","Red","Green"],"a":"Red","source":"Light Booklet Year 9 2025"},{"cat":"light","type":"mcq","q":"The primary colours of light are:","options":["Red, yellow, blue","Red, green, blue","Cyan, magenta, yellow"],"a":"Red, green, blue","source":"Light Booklet Year 9 2025"},{"cat":"light","type":"mcq","q":"Red light plus green light produces:","options":["Cyan","Yellow","Magenta"],"a":"Yellow","source":"Light Booklet Year 9 2025"},{"cat":"light","type":"mcq","q":"A red object looks red because it:","options":["Emits only red light","Mainly reflects red light and absorbs other colours","Absorbs only red light"],"a":"Mainly reflects red light and absorbs other colours","source":"Visible Light"},{"cat":"light","type":"mcq","q":"A black object looks black because it:","options":["Reflects all colours","Absorbs most colours of light","Produces black light"],"a":"Absorbs most colours of light","source":"Visible Light"},{"cat":"light","type":"mcq","q":"Scientists now describe light as having a dual nature, meaning it behaves as:","options":["Only a wave","Only a particle","Both a wave and particles (photons)"],"a":"Both a wave and particles (photons)","source":"Light Booklet Year 9 2025"},{"cat":"electricity","type":"mcq","q":"Electric current is the flow of:","options":["Protons around a magnet","Electrons around a connected circuit","Sound through a wire"],"a":"Electrons around a connected circuit","source":"Year 9 Electricity 2025"},{"cat":"electricity","type":"text","q":"What unit is electric current measured in?","a":["amps","amperes","A"],"source":"Year 9 Electricity 2025"},{"cat":"electricity","type":"mcq","q":"Voltage is measured with a voltmeter connected:","options":["In series with the component","Across (in parallel with) the component","Only to earth"],"a":"Across (in parallel with) the component","source":"Current in Series and Parallel circuits"},{"cat":"electricity","type":"mcq","q":"An ammeter must be connected:","options":["In series with the component","In parallel with the component","Outside the circuit"],"a":"In series with the component","source":"Current in Series and Parallel circuits"},{"cat":"electricity","type":"mcq","q":"In a series circuit the current is:","options":["Different at every point","The same at any point","Zero except at the battery"],"a":"The same at any point","source":"Current in Series and Parallel circuits"},{"cat":"electricity","type":"mcq","q":"In a series circuit the supply voltage is:","options":["The same across every component","Shared between the components","Always zero"],"a":"Shared between the components","source":"Current in Series and Parallel circuits"},{"cat":"electricity","type":"mcq","q":"In a parallel circuit the source voltage across each branch is:","options":["Shared so each branch gets less","The same as the source voltage","Always half"],"a":"The same as the source voltage","source":"Current in Series and Parallel circuits"},{"cat":"electricity","type":"mcq","q":"In a parallel circuit the current:","options":["Is identical in every wire","Splits between the branches","Cannot flow"],"a":"Splits between the branches","source":"Current in Series and Parallel circuits"},{"cat":"electricity","type":"mcq","q":"Adding an extra battery in series usually makes the current:","options":["Decrease because of more resistance","Increase because there is a greater push on the electrons","Stay exactly the same"],"a":"Increase because there is a greater push on the electrons","source":"Current in Series and Parallel circuits"},{"cat":"electricity","type":"mcq","q":"Adding an extra bulb in series usually makes the current:","options":["Increase","Decrease because there is greater resistance","Become infinite"],"a":"Decrease because there is greater resistance","source":"Current in Series and Parallel circuits"},{"cat":"electricity","type":"mcq","q":"A key advantage of parallel circuits in homes is that:","options":["If one appliance breaks the others can still work","Current is always smaller than in series","You cannot add extra appliances"],"a":"If one appliance breaks the others can still work","source":"Current in Series and Parallel circuits"},{"cat":"electricity","type":"mcq","q":"Metals conduct electricity well because they have:","options":["A sea of free outer electrons","No charged particles","Only neutrons"],"a":"A sea of free outer electrons","source":"Year 9 Electricity 2025"},{"cat":"electricity","type":"mcq","q":"Materials that do not allow electricity to pass easily are called:","options":["Conductors","Insulators","Ammeter"],"a":"Insulators","source":"Year 9 Electricity 2025"},{"cat":"electricity","type":"mcq","q":"Electrons leave the battery from the:","options":["Positive terminal","Negative terminal","Switch only"],"a":"Negative terminal","source":"Year 9 Electricity 2025"},{"cat":"electricity","type":"mcq","q":"A bulb will not light unless the circuit is:","options":["Open","Closed (complete)","Made of wood"],"a":"Closed (complete)","source":"Circuit Inquiry / PHET"},{"cat":"electricity","type":"mcq","q":"If voltage is kept constant and resistance increases, current:","options":["Increases","Decreases","Stays the same"],"a":"Decreases","source":"Circuit Inquiry"},{"cat":"electricity","type":"text","q":"What is the unit of resistance?","a":["ohms","ohm","Ω"],"source":"Year 9 Electricity 2025"},{"cat":"electricity","type":"mcq","q":"The job of a battery in a simple circuit is to convert:","options":["Light energy into chemical energy","Chemical energy into electrical energy","Sound energy into nuclear energy"],"a":"Chemical energy into electrical energy","source":"Year 9 Electricity 2025"},{"cat":"radioactivity","type":"mcq","q":"Isotopes of an element have the same number of protons but different numbers of:","options":["Electrons in every case","Neutrons","Nuclei"],"a":"Neutrons","source":"Year 9 Radioactivity Booklet"},{"cat":"radioactivity","type":"text","q":"Mass number A equals atomic number Z plus which other number?","a":["neutron number","number of neutrons","N"],"source":"Year 9 Radioactivity Booklet"},{"cat":"radioactivity","type":"mcq","q":"How many neutrons are in chlorine-35 (atomic number 17)?","options":["17","18","35"],"a":"18","source":"Year 9 Radioactivity Booklet"},{"cat":"radioactivity","type":"mcq","q":"How many neutrons are in chlorine-37 (atomic number 17)?","options":["17","20","37"],"a":"20","source":"Radioactivity presentation"},{"cat":"radioactivity","type":"mcq","q":"A nucleus may be unstable if it has:","options":["The right balance of protons and neutrons and is not too big","Too many neutrons, too many protons, or is too heavy","No electrons"],"a":"Too many neutrons, too many protons, or is too heavy","source":"Radioactivity presentation"},{"cat":"radioactivity","type":"mcq","q":"An alpha particle is:","options":["A high-energy electron","A helium nucleus (2 protons and 2 neutrons)","An electromagnetic wave"],"a":"A helium nucleus (2 protons and 2 neutrons)","source":"Radioactivity presentation"},{"cat":"radioactivity","type":"mcq","q":"In alpha decay, the mass number of the nucleus decreases by:","options":["1","2","4"],"a":"4","source":"Radioactivity presentation"},{"cat":"radioactivity","type":"mcq","q":"In alpha decay, the atomic number decreases by:","options":["1","2","4"],"a":"2","source":"Radioactivity presentation"},{"cat":"radioactivity","type":"mcq","q":"In beta decay, a neutron changes into a proton and:","options":["An alpha particle","A high-energy electron (beta particle)","A helium nucleus"],"a":"A high-energy electron (beta particle)","source":"Radioactivity presentation"},{"cat":"radioactivity","type":"mcq","q":"In beta decay the mass number:","options":["Decreases by 4","Stays the same","Increases by 1"],"a":"Stays the same","source":"Radioactivity presentation"},{"cat":"radioactivity","type":"mcq","q":"In beta decay the atomic number:","options":["Increases by 1","Decreases by 2","Stays the same"],"a":"Increases by 1","source":"Radioactivity presentation"},{"cat":"radioactivity","type":"mcq","q":"Gamma emission from a nucleus:","options":["Changes A and Z","Releases energy but the nucleus stays the same element","Removes two protons"],"a":"Releases energy but the nucleus stays the same element","source":"Radioactivity presentation"},{"cat":"radioactivity","type":"mcq","q":"Alpha radiation is stopped by:","options":["Thick lead only","Paper or skin","Nothing — it always passes through"],"a":"Paper or skin","source":"Radioactivity presentation"},{"cat":"radioactivity","type":"mcq","q":"Beta radiation is stopped by:","options":["A sheet of paper","Thin aluminium","A few centimetres of air only, never metal"],"a":"Thin aluminium","source":"Radioactivity presentation"},{"cat":"radioactivity","type":"mcq","q":"Gamma radiation is reduced by:","options":["Paper","Thick lead or concrete","A thin mica window only"],"a":"Thick lead or concrete","source":"Year 9 Radioactivity Booklet"},{"cat":"radioactivity","type":"mcq","q":"Inside the body, which radiation is the most ionising and can do the most damage?","options":["Alpha","Beta","Gamma"],"a":"Alpha","source":"Radioactivity presentation"},{"cat":"radioactivity","type":"mcq","q":"Outside the body, which is generally the most dangerous because it is the most penetrating?","options":["Alpha","Beta","Gamma"],"a":"Gamma","source":"Radioactivity presentation"},{"cat":"radioactivity","type":"mcq","q":"Half-life is the time taken for:","options":["All nuclei to decay","The number of radioactive nuclei (or count rate) to fall by 50%","The temperature to halve"],"a":"The number of radioactive nuclei (or count rate) to fall by 50%","source":"Radioactivity presentation"},{"cat":"radioactivity","type":"mcq","q":"A radioisotope has a half-life of 14 days and starts at 1080 Bq. What is the count rate after 4 weeks?","options":["540 Bq","270 Bq","135 Bq"],"a":"270 Bq","source":"Year 9 Radioactivity Booklet"},{"cat":"radioactivity","type":"mcq","q":"After 4 half-lives, what fraction of a radioactive sample remains?","options":["1/4","1/8","1/16"],"a":"1/16","source":"Year 9 Radioactivity Booklet"},{"cat":"radioactivity","type":"mcq","q":"Carbon-14 dating works because living things stop taking in carbon when they die, and C-14 then decays with a half-life of about:","options":["22 minutes","5730 years","4.5 billion years"],"a":"5730 years","source":"Radioactivity presentation"},{"cat":"radioactivity","type":"mcq","q":"Smoke detectors often contain americium-241, which is useful because it is:","options":["A short-lived gamma source","An alpha emitter with a long half-life","A beta source stopped by paper mills"],"a":"An alpha emitter with a long half-life","source":"Year 9 Radioactivity Booklet"},{"cat":"radioactivity","type":"mcq","q":"Paper-mill thickness control often uses beta radiation because:","options":["Beta can pass through paper and the count rate changes with thickness","Alpha always goes through steel rollers","Gamma is stopped by a single sheet of paper"],"a":"Beta can pass through paper and the count rate changes with thickness","source":"Year 9 Radioactivity Booklet"},{"cat":"radioactivity","type":"mcq","q":"A medical tracer is a radioisotope used so that:","options":["Its path through the body can be followed by detecting emitted radiation","It permanently replaces all body carbon","It stops all cell division immediately"],"a":"Its path through the body can be followed by detecting emitted radiation","source":"Year 9 Radioactivity Booklet"},{"cat":"radioactivity","type":"mcq","q":"Activity of a radioactive source is measured in:","options":["Volts","Becquerels (Bq)","Hertz only"],"a":"Becquerels (Bq)","source":"Radioactive decay worksheet"},{"cat":"radioactivity","type":"mcq","q":"1 Bq equals:","options":["1 decay per second","1 decay per hour","1 joule"],"a":"1 decay per second","source":"Radioactive decay worksheet"},{"cat":"radioactivity","type":"mcq","q":"Relative atomic mass is the average mass of an element's isotopes, taking into account:","options":["Colour","Abundance of each isotope","Only the heaviest isotope"],"a":"Abundance of each isotope","source":"Year 9 Radioactivity Booklet"},{"cat":"radioactivity","type":"mcq","q":"An element has isotopes of mass 10 (20%) and 11 (80%). RAM to 1 d.p. is:","options":["10.2","10.8","11.0"],"a":"10.8","source":"Year 9 Radioactivity Booklet"},{"cat":"radioactivity","type":"mcq","q":"Radioactive decay is unpredictable for a single nucleus, which is why Geiger counter clicks:","options":["Are perfectly evenly spaced","Occur at random times","Never happen outdoors"],"a":"Occur at random times","source":"Year 9 Radioactivity Booklet"},{"cat":"radioactivity","type":"mcq","q":"The SHE radioactivity task asks you to discuss a use of nuclear technology including:","options":["Only weapon design","Advantages, disadvantages and a bibliography","Only jokes about radiation"],"a":"Advantages, disadvantages and a bibliography","source":"Radioactivity SHE Task 2025"}],"noteSections":[{"id":"energy-forms","topic":"energy","title":"Energy forms and transformations","pack":"Energy transfers and transformations","sources":["1. Energy_.pptx","1. Energy_NAn.pptx","1a. Energy Forms & Changes (PhET).docx","1b. Energy Skate Park Basics (PhET).docx"],"summary":"Energy is the capacity to do work, measured in joules. It cannot be created or destroyed — only transferred or transformed.","blocks":[{"heading":"What energy is","body":["Energy is the capacity to do work. Work means a force causing movement through a distance.","Energy is measured in joules (J).","Most energy on Earth can be traced back to the Sun: plants store light as chemical energy, animals eat plants, and fossil fuels formed from ancient living things."]},{"heading":"Kinetic versus potential","body":["Kinetic-type energies involve particles or objects moving: kinetic, thermal (heat), light, electrical and sound.","Potential energies can be stored: gravitational, chemical, elastic and nuclear.","Kinetic energy is the energy of movement: Ek = ½mv².","Gravitational potential energy is due to position in a gravitational field: Ep = mgh.","Elastic potential energy is stored when an object is stretched or compressed.","Chemical energy is stored in chemical bonds (food, fuel, batteries).","Light energy is given out by luminous objects such as the Sun, flames and globes."]},{"heading":"Conservation of energy","body":["1st law of thermodynamics: the total energy of the universe is constant. Energy cannot be created or destroyed; it can only change place or form.","A student in class: chemical energy (food) → kinetic + heat + sound.","A fan: electrical → kinetic (+ heat + sound).","A light globe: electrical → light (+ heat).","A bow: kinetic → elastic potential → kinetic (+ heat + sound)."]},{"heading":"From the PhET lessons","body":["Energy Forms & Changes: turning on Energy Symbols lets you see energy flow from source → generator → output.","Faucet, kettle steam or a cyclist can spin a turbine; sunlight drives solar panels.","A fluorescent bulb wastes less heat than an incandescent bulb — that is why it is more efficient.","Energy Skate Park: on a frictionless track, PE + KE stays constant. PE is highest at the top; KE is highest at the bottom.","Friction turns some mechanical energy into thermal energy, so the skater gradually loses height."]}],"formulas":[{"name":"Kinetic energy","formula":"Ek = ½mv²","note":"m in kg, v in m/s, Ek in J"},{"name":"Gravitational potential energy","formula":"Ep = mgh","note":"g ≈ 9.81 N/kg on Earth (worksheets often use 10)"}],"glossary":[{"term":"Energy transformation","def":"Energy changing from one form into another."},{"term":"Energy transfer","def":"Energy moving from one place or object to another."},{"term":"Mechanical energy","def":"Emech = Ek + Ep"}]},{"id":"energy-sankey","topic":"energy","title":"Sankey diagrams and efficiency","pack":"Sankey Energy Diagrams","sources":["2. Sankey Energy Diagrams.pptx","2. Sankey Energy Diagrams KP.pptx","2. Sankey Energy Diagrams Worksheet.docx"],"summary":"Sankey diagrams show how input energy splits into useful and wasted outputs. Arrow width is proportional to energy, because energy is conserved.","blocks":[{"heading":"Reading a Sankey diagram","body":["The input arrow on the left is the energy going in (often electrical or chemical).","Arrows continuing to the right are useful energy. Arrows bending down are wasted energy (usually heat and sometimes sound).","The thickness of the input arrow equals the total thickness of the output arrows — law of conservation of energy."]},{"heading":"Efficiency","body":["Efficiency = (useful energy ÷ input energy) × 100. It is given as a percentage.","Wasted energy = input energy − useful energy.","A filament lamp: 100 J electrical in, 10 J light out, 90 J heat wasted → 10% efficient.","From the class examples: TV ≈ 51%, hairdryer ≈ 67%, vacuum cleaner ≈ 30%.","More stars on an appliance energy label means it wastes less energy, so it usually costs less to run."]}],"formulas":[{"name":"Efficiency","formula":"η = (useful / input) × 100%"},{"name":"Wasted energy","formula":"Ewasted = Einput − Euseful"}],"worked":[{"q":"A torch uses 100 J of electrical energy to make 10 J of light and 90 J of heat. Sketch the Sankey idea and find efficiency.","a":"Input 100 J; useful 10 J light; wasted 90 J heat. Efficiency = 10/100 × 100 = 10%."},{"q":"A vacuum takes 1440 kJ in and produces 430 kJ motion and 100 kJ sound. Find heating waste and efficiency if motion is useful.","a":"Heating = 1440 − 430 − 100 = 910 kJ. Efficiency = 430/1440 × 100 ≈ 30%."}]},{"id":"energy-work","topic":"energy","title":"Work, GPE and KE","pack":"Mechanical energy and work","sources":["3. Work, GPE & KE (Formulas).pptx","3. Work, GPE & KE_(questions).docx"],"summary":"Work is force times displacement in the direction of the force. Doing work stores or transfers energy, including GPE and KE.","blocks":[{"heading":"When is work done?","body":["Work is done when a force acts on an object and causes a displacement in the direction of that force. W = F × s.","Units: joules (J) or newton-metres (N m).","Pushing a wall until you are exhausted is not work on the wall — the wall does not move.","A book falling is work: gravity displaces it downwards.","Carrying a tray at constant height across a room is not work on the tray: the upward force is perpendicular to the displacement."]},{"heading":"GPE and KE","body":["Ep = mgh. Worksheets often take g = 10 N/kg; the formula slides use 9.81 N/kg.","A 250 g tin lifted 2 m: Ep = 0.250 × 9.81 × 2 ≈ 4.9 J.","Ek = ½mv². Doubling speed quadruples kinetic energy because v is squared.","If air resistance is ignored, GPE lost = KE gained for a falling object."]}],"formulas":[{"name":"Work","formula":"W = F × s"},{"name":"GPE","formula":"Ep = mgh"},{"name":"KE","formula":"Ek = ½mv²"},{"name":"Rearrange mass from KE","formula":"m = 2Ek / v²"},{"name":"Rearrange speed from KE","formula":"v = √(2Ek / m)"}],"worked":[{"q":"Robert pushes a car 50 m with 1000 N. Work?","a":"W = 1000 × 50 = 50 000 J."},{"q":"5 kg cat lifted 2 m (g = 10). GPE?","a":"Ep = 5 × 10 × 2 = 100 J."},{"q":"3 kg cat running at 4 m/s. KE?","a":"Ek = ½ × 3 × 16 = 24 J."},{"q":"50 kg goat, 450 m cliff, g = 10. Speed just before the ground, ignoring air resistance?","a":"Ep = 50 × 10 × 450 = 225 000 J = KE. v = √(2 × 225000 / 50) = √9000 ≈ 95 m/s."}]},{"id":"heat-conduction","topic":"heat","title":"Heat, temperature and conduction","pack":"Heat transfer","sources":["Heat, Temperature and Conduction (existing hub notes)"],"summary":"Temperature is linked to the average kinetic energy of particles. Heat flows from hotter to cooler matter.","blocks":[{"heading":"Particle model","body":["Matter is modelled as tiny particles. Particle motion is linked to kinetic energy.","Changing state changes how particles are arranged and how they move.","Temperature is linked to the average kinetic energy of particles.","Heat (thermal energy transfer) occurs when there is a temperature difference, from hotter to cooler."]},{"heading":"Conduction","body":["Conduction transfers thermal energy through direct contact between particles.","Metals conduct well because outer electrons are free to move and transfer energy — the 'sea of electrons'.","Insulators are poor conductors. Trapped air is useful because air is a poor conductor."]}]},{"id":"heat-convection","topic":"heat","title":"Convection, radiation and insulation","pack":"Heat transfer","sources":["Convection + 2026 Insulation Investigation","Heat Transfer: Radiation"],"summary":"Convection moves heated fluids; radiation uses electromagnetic waves and can travel through a vacuum.","blocks":[{"heading":"Convection","body":["Convection occurs in liquids and gases as the heated substance moves.","Warm fluid becomes less dense and rises; cooler, denser fluid sinks, creating convection currents."]},{"heading":"Radiation","body":["Radiation transfers heat using electromagnetic waves (infrared).","Infrared can travel through a vacuum — that is how energy travels from the Sun to Earth.","Dark surfaces are good absorbers and emitters. Shiny surfaces tend to reflect more infrared."]},{"heading":"Insulation investigation","body":["The 2026 investigation asks how insulation changes heat transfer to ice.","Plan variables, controls, repeat trials, averages, graphs and a conclusion."]}]},{"id":"sound-waves","topic":"sound","title":"Sound and waves","pack":"Sound","sources":["Introduction to Sound","Sound & Particles"],"summary":"Sound is a mechanical longitudinal wave that needs a medium.","blocks":[{"heading":"Key ideas","body":["Sound starts with a vibration and travels through a medium.","It is a mechanical longitudinal wave: compressions (crowded) and rarefactions (spread out).","Amplitude is linked to loudness; frequency is linked to pitch.","Sound travels faster through solids than gases because particles are closer together.","Sound cannot travel through a vacuum; light can, because light is electromagnetic."]}]},{"id":"em-spectrum","topic":"emspectrum","title":"The electromagnetic spectrum","pack":"The Electromagnetic Spectrum","sources":["1. The Electromagnetic Spectrum.pptx","EM Spectrum_worksheet.pptx","Light Booklet- Year 9 (2025).docx"],"summary":"EM waves are transverse, travel at 3 × 10⁸ m/s in vacuum, and obey v = fλ. Shorter wavelength means higher frequency, energy and hazard.","blocks":[{"heading":"Shared properties of all EM waves","body":["They transfer energy, are transverse, can be reflected, and can travel through a vacuum.","They all travel at the speed of light in vacuum: 300 000 000 m/s (3.00 × 10⁸ m/s).","They obey v = f × λ. Shorter wavelength ↔ higher frequency ↔ more energy ↔ more dangerous.","Order of increasing frequency / decreasing wavelength: radio → microwave → infrared → visible → ultraviolet → X-ray → gamma.","Red sits next to infrared; violet sits next to ultraviolet."]},{"heading":"Radio and microwaves","body":["Radio waves have the longest wavelengths. Uses: radio, television, some mobile signals.","They mostly pass through the body and are not strongly absorbed.","Microwaves: longer ones heat food by vibrating water molecules; shorter ones are used in radar and satellite links.","Space waves / microwaves can be sent in a thin beam to a satellite because they diffract very little."]},{"heading":"Infrared and visible","body":["Infrared lies between microwaves and visible light. All objects emit IR; hotter objects emit more.","Uses: heating, cooking, remotes, optical fibres, thermal cameras, ear thermometers, burglar sensors.","Too much high-energy IR burns skin (the same heating you feel from a grill).","Visible light is the only EM radiation the human eye detects (about 390–780 nm)."]},{"heading":"Ultraviolet, X-rays and gamma","body":["UV is emitted by very hot objects (the Sun), sparks, arc welding, tanning beds and black lights.","Uses: tanning, fluorescent security inks and high-visibility clothing, banknote checks, vitamin D production.","Hazards: sunburn, premature ageing, skin cancer, eye inflammation and cataracts. Cover up, hat, sunglasses, sunscreen.","X-rays: produced when high-energy electrons hit a tungsten target in an X-ray tube. Used for medical and security imaging, cancer treatment and crystallography.","Bones absorb more X-rays than soft tissue, so they appear white on film. Radiographers use lead shielding.","Gamma rays have the shortest wavelength and highest energy. Emitted by radioactive materials. Used for medical imaging (tracers + gamma camera), industrial inspection, sterilising equipment and radiotherapy."]}],"formulas":[{"name":"Wave equation","formula":"v = fλ","note":"For all EM waves in vacuum, v = 3.00 × 10⁸ m/s"}],"glossary":[{"term":"Ionizing radiation","def":"High-energy waves (short UV, X-rays, gamma) that can ionize atoms and damage DNA."},{"term":"Fluorescence","def":"Absorbing UV and re-emitting lower-energy visible light."}]},{"id":"visible-light","topic":"light","title":"Visible light","pack":"Visible Light","sources":["2. Visible Light_.pptx","Light Booklet- Year 9 (2025).docx"],"summary":"Light travels in straight lines, carries energy, and is the only EM radiation we can see. We see because light enters our eyes.","blocks":[{"heading":"Seeing","body":["Light from a candle can travel just as far as light from the Sun — it does not stop just because it is daytime.","We see because light travels from an object (emitted or reflected) into our eyes, not the other way around.","Luminous objects give out light (Sun, globes). Non-luminous objects such as the Moon are seen by reflected light.","Transparent materials transmit light clearly; translucent materials transmit some light but blur detail; opaque materials absorb or reflect, so you cannot see through them."]},{"heading":"Day and night","body":["As Earth rotates, the side facing the Sun is in daylight.","Light travels in straight lines and Earth is opaque, so the far side is in shadow — night."]},{"heading":"A model for light","body":["Light is rectilinear: it travels in straight lines, which is why shadows form and we cannot see around corners.","Ray diagrams model a narrow beam as a straight line with an arrow. Always use a sharp pencil and ruler.","Scientists treat light as having a dual nature: wave and particle (photon)."]}]},{"id":"reflection","topic":"light","title":"Reflection","pack":"Reflection","sources":["3. Reflection.pptx","Light Booklet- Year 9 (2025).docx"],"summary":"Angle of incidence equals angle of reflection. Smooth surfaces give clear images; rough surfaces scatter light.","blocks":[{"heading":"Law of reflection","body":["The normal is a line at 90° to the surface at the point of incidence.","Incident ray travels towards the surface; reflected ray travels away.","Law of reflection: i = r. This applies to all waves, including EM waves.","Angles are always measured between the ray and the normal, not the mirror."]},{"heading":"Specular vs diffuse","body":["Smooth, shiny surfaces (mirrors, still water) give clear / specular reflection — ordered rays, a clear image.","Rough, dull surfaces give diffuse reflection — light scatters, so you do not see a mirror image. The law i = r still holds for each tiny bit of surface."]},{"heading":"Curved mirrors","body":["A curved mirror can be thought of as many tiny plane mirrors.","Concave (caves in): parallel rays meet at a real focal point. Uses: makeup mirrors, headlights, some telescopes.","Convex (bulges out): rays diverge and appear to come from a focal point behind the mirror. Uses: shop security, car side mirrors — wide field of view.","A tighter curve moves the focal point."]}],"glossary":[{"term":"Incident ray","def":"The incoming ray that hits the surface."},{"term":"Reflected ray","def":"The ray that bounces off the surface."},{"term":"Normal","def":"A construction line at 90° to the surface."},{"term":"Focal point","def":"Where reflected (or refracted) rays meet, or appear to meet."}]},{"id":"refraction","topic":"light","title":"Refraction, TIR and lenses","pack":"Refraction","sources":["4. Refraction.pptx","Light Booklet- Year 9 (2025).docx"],"summary":"Light bends when its speed changes. Denser medium: slower, towards the normal. Less dense: faster, away from the normal.","blocks":[{"heading":"Why light bends","body":["Refraction is the bending of light as it moves between different substances because its speed changes.","Car-on-sand analogy: the first wheel slows in the sand so the car turns.","Air → glass: light slows and bends towards the normal.","Glass → air: light speeds up and ben
