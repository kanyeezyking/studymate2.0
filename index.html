ds away from the normal.","This is why a pencil looks bent in water, a stone looks closer than it is, and a fish is not where it appears when speared from a boat."]},{"heading":"Total internal reflection","body":["When light goes from more dense to less dense, the angle of refraction is larger than i.","If i increases, r can reach 90°. That incidence angle is the critical angle ic.","If i ≥ ic, the light does not leave — it reflects inside with i = r. That is total internal reflection.","TIR is used in optical fibres and some prisms (for example periscopes)."]},{"heading":"Lenses","body":["Convex (converging) lenses are thicker in the middle and can bring rays to a focus. They can form a real image on a screen.","Concave (diverging) lenses are thinner in the middle and spread rays out. Images are usually upright, diminished and virtual.","A thicker convex lens has a shorter focal length."]}],"glossary":[{"term":"Critical angle","def":"The angle of incidence (denser → less dense) that gives a 90° refracted ray."},{"term":"Total internal reflection","def":"All light reflects inside a denser medium when i ≥ ic."}]},{"id":"colour","topic":"light","title":"Colour, dispersion and mixing","pack":"Colour and rainbows","sources":["5. Colour Powerpoint.pptx","Light Booklet- Year 9 (2025).docx"],"summary":"White light is a mixture of colours. A prism disperses it because different wavelengths slow by different amounts.","blocks":[{"heading":"Dispersion and rainbows","body":["White light is made of many colours with different wavelengths.","In a prism the colours slow by different amounts, so white light splits. This is dispersion.","Order is always ROYGBIV: red, orange, yellow, green, blue, indigo, violet.","Red has the longest visible wavelength and is bent least; violet is bent most.","A rainbow is refraction (and reflection) in raindrops, not reflection only, and not because light speeds up in a prism.","A second prism can recombine the spectrum into white light."]},{"heading":"Mixing coloured light","body":["Primary colours of light are red, green and blue (additive mixing — different from paint).","Red + green = yellow; blue + green = cyan; red + blue = magenta.","Red + green + blue = white. No light = black.","Yellow is complementary to blue; cyan to red; magenta to green.","A colour television builds all colours from tiny red, green and blue dots.","A red object mainly reflects red and absorbs other colours. White reflects all; black absorbs most."]}]},{"id":"electricity-intro","topic":"electricity","title":"Electricity: current, voltage and materials","pack":"Year 9 Electricity 2025","sources":["4. Introduction to Electricity 2025.pptx","4. Year 9 Electricity 2025.pptx","7. Circuit Inquiry.docx"],"summary":"Current is the flow of electrons, pushed by voltage. Metals conduct because they have a sea of free electrons.","blocks":[{"heading":"Key quantities","body":["Current (I) is the flow of electrons around a connected circuit, measured in amps (A) with an ammeter.","Voltage (V) is the push on electrons from the cell/battery, measured in volts (V) with a voltmeter.","Resistance (R) measures how much a material tries to stop the flow, measured in ohms (Ω).","A battery converts chemical energy into electrical energy. A bulb converts electrical energy into light (and heat).","Electrons leave the negative terminal and are attracted to the positive terminal. The switch must be closed (complete circuit)."]},{"heading":"Conductors and insulators","body":["Conductors (metals, graphite) allow charge to flow. Insulators (wood, plastic, rubber) do not.","Metal atoms have outer electrons that can drift. This sea of electrons also explains why metals conduct heat.","If voltage is constant, increasing resistance decreases current."]}],"glossary":[{"term":"Series","def":"Components in one continuous loop."},{"term":"Parallel","def":"Two or more separate loops off the same source."}]},{"id":"electricity-circuits","topic":"electricity","title":"Series and parallel circuits","pack":"Current in series and parallel","sources":["v5. 2025 Current in Series and Parallel circuits_.pptx","2. PHET Electric Circuit Design Challenge.docx"],"summary":"Series: current same everywhere, voltage shared. Parallel: voltage same across branches, current splits.","blocks":[{"heading":"How to measure","body":["Ammeter: always in series (in the same loop) as the component.","Voltmeter: always in parallel (across) the component."]},{"heading":"Series rules","body":["Current is the same at every point.","Supply voltage is shared between the components.","Adding a battery increases current (greater push). Adding a bulb decreases current (greater resistance)."]},{"heading":"Parallel rules","body":["The source voltage is the same across each branch.","Current splits between branches (equal split if the bulbs are the same).","Advantages: extra appliances can be added without dimming the others; if one breaks the others still work. That is why homes use parallel lighting circuits."]},{"heading":"Design challenge reminders","body":["Three bulbs equally bright → same current through each, so a parallel arrangement.","A switch that controls only some bulbs sits on those branches only.","Kitchen lights that must switch together can share a branch; living room and bedroom stay independent."]}]},{"id":"radio-isotopes","topic":"radioactivity","title":"Isotopes and atomic notation","pack":"Isotopes and Radioactivity booklet","sources":["0. Year 9 Radioactivity Booklet 2020 SS (2).docx","6. Radioactivity.pptx"],"summary":"Isotopes are atoms of the same element (same protons) with different numbers of neutrons.","blocks":[{"heading":"Atomic structure recap","body":["Atomic number Z = number of protons. In a neutral atom, electrons = protons.","Mass number A = protons + neutrons. Neutron number N = A − Z.","Notation: ᴬZX, sometimes with N written as well.","Almost all of the mass of an atom is in the nucleus."]},{"heading":"Isotopes","body":["Carbon-12 and carbon-14 both have 6 protons; C-14 has two extra neutrons.","Chlorine-35 has 18 neutrons; chlorine-37 has 20 neutrons (Z = 17).","Lithium-6 has 3 protons and 3 neutrons; lithium-7 has 3 protons and 4 neutrons.","A stable isotope has a nucleus that is unlikely to break apart. Unstable isotopes are radioactive.","Unstable if: too many neutrons for the protons, too many protons for the neutrons, or the nucleus is too heavy."]},{"heading":"Relative atomic mass","body":["RAM (Ar) is the average mass of all naturally occurring isotopes, weighted by abundance, on a scale where ¹²C is exactly 12.","RAM = Σ (mass number × % abundance) / 100.","Example: 20% mass 10 and 80% mass 11 → RAM = (10×20 + 11×80)/100 = 10.8."]}],"formulas":[{"name":"Neutron number","formula":"N = A − Z"},{"name":"Relative atomic mass","formula":"Ar = Σ(A × % abundance) / 100"}],"worked":[{"q":"Uranium-235 (Z = 92). Protons, electrons, neutrons?","a":"92 protons, 92 electrons (neutral), 235 − 92 = 143 neutrons."}]},{"id":"radio-decay","topic":"radioactivity","title":"Radioactive decay: alpha, beta, gamma","pack":"Isotopes and Radioactivity booklet","sources":["0. Year 9 Radioactivity Booklet 2020 SS (2).docx","6. Radioactivity.pptx"],"summary":"Unstable nuclei emit radiation to become more stable. Alpha, beta and gamma differ in what they are, how they change the nucleus, and how far they travel.","blocks":[{"heading":"Alpha (α)","body":["An alpha particle is a helium nucleus: 2 protons and 2 neutrons (⁴₂He / ⁴₂α).","Mass number decreases by 4; atomic number decreases by 2. The new element is two places lower in the periodic table.","Stopped by paper or skin. Highly ionising, so very damaging if the source is inside the body."]},{"heading":"Beta (β)","body":["A neutron changes into a proton plus an electron. The proton stays; the electron is fired out as a beta particle.","Mass number stays the same; atomic number increases by 1.","Stopped by thin aluminium. Less ionising than alpha."]},{"heading":"Gamma (γ)","body":["A high-energy electromagnetic photon. A and Z do not change — the nucleus just loses energy.","Reduced by thick lead or concrete. Least ionising but most penetrating, so most dangerous from outside the body."]},{"heading":"Ionising versus penetrating","body":["Inside the body: alpha does the most damage.","Outside the body: gamma is the main concern because alpha is stopped by skin.","A Geiger counter clicks randomly because each decay is unpredictable.","Background radiation is always there (rocks, Sun). Compare count rates with and without a source."]}]},{"id":"radio-halflife","topic":"radioactivity","title":"Half-life","pack":"Isotopes and Radioactivity booklet","sources":["0. Year 9 Radioactivity Booklet 2020 SS (2).docx","6. Radioactivity.pptx"],"summary":"Half-life is the time for the number of radioactive nuclei, or the count rate, to fall by 50%. It is different for every isotope.","blocks":[{"heading":"What half-life means","body":["After 1 half-life: 50% left (1/2). After 2: 25% (1/4). After 3: 12.5% (1/8). After 4: 6.25% (1/16).","Activity is measured in becquerels: 1 Bq = 1 decay per second.","The M&M lab models this: face-up sweets are undecayed parent nuclei; each shake is a half-life. It is random for each sweet, but the group follows a curve.","Carbon-14 half-life is about 5730 years. Living things take in C-14; after death it decays, which is the basis of radiocarbon dating (useful to ~50 000 years)."]}],"formulas":[{"name":"Remaining fraction","formula":"remaining = (1/2)^n","note":"n = number of half-lives"}],"worked":[{"q":"Half-life 14 days, start 1080 Bq, after 4 weeks?","a":"4 weeks = 2 half-lives. 1080 → 540 → 270 Bq."},{"q":"Half-life 5000 years. Fraction remaining after 20 000 years?","a":"n = 4, remaining = 1/16."},{"q":"4000 Bq, half-life 12 h, down to 500 Bq?","a":"4000 → 2000 → 1000 → 500 is 3 half-lives = 36 hours."},{"q":"100 g of radon-222, half-life 3.8 days, after 15.2 days?","a":"n = 4, remaining = 100 / 16 = 6.25 g."},{"q":"C-14 half-life 5730 y. 70 mg after 17 190 y?","a":"n = 3, remaining = 70 / 8 = 8.75 mg."}]},{"id":"radio-uses","topic":"radioactivity","title":"Uses of radioisotopes (SHE task)","pack":"Radioactivity — Science as a Human Endeavour","sources":["Radioactivity SHE Task 2025.docx","Student Activity_ Radioactivity – Good or Bad_.docx","0. Year 9 Radioactivity Booklet 2020 SS (2).docx"],"summary":"Nuclear technology has real benefits and real risks. The 2025 SHE task is a short group presentation with advantages, disadvantages and a bibliography.","blocks":[{"heading":"The task","body":["Radiation is around us (Sun, rocks). Cells can repair some damage, but stronger radiation and longer exposure increase risk — including cancer.","Choose one use: nuclear medicine, nuclear power, radiocarbon dating, food irradiation, industrial testing, smoke detectors, and so on. Nuclear weapons are excluded.","Presentation: introduce why it matters, how it works, advantages, disadvantages/risks, summary opinion, and a formatted bibliography (3–5+ sources)."]},{"heading":"How common uses work","body":["Medical tracers: a radioisotope replaces a non-radioactive isotope in a compound; its path is tracked (gamma camera). Choose a short half-life so activity falls quickly after the test.","Radiotherapy: focused gamma or X-rays kill cancer cells. Dose is split and the beam is rotated to spare healthy tissue.","Smoke detectors: americium-241 (alpha, half-life ~460 years). Smoke blocks some alpha particles and triggers the alarm.","Thickness control: beta through paper; count rate tells the mill whether to move the rollers. Need a long half-life so the source stays steady.","Carbon dating: remaining C-14 in once-living material. Used on charcoal, bone and shell, including Australian sites such as Lake Mungo.","Food irradiation and sterilising equipment: penetrating gamma kills microbes."]},{"heading":"Risks to weigh","body":["Ionizing radiation can kill cells or damage DNA. Waste storage, accidents, and unequal access are ethical issues for power and medicine.","Manage risk with shielding, distance, time, and matching the isotope (type + half-life) to the job."]}]},{"id":"chemistry-atoms","topic":"chemistry","title":"Atomic structure and reactions","pack":"2026 Chemistry source pack","sources":["1. Structure of Atoms.pptx","2. Electron Configuration and Ions.pptx","3. Intro to chemical reactions.pptx","4. Acid reactions.pptx","5. Combustion & corrosion reactions.pptx","Year 9 Chemistry Checklist 2026"],"summary":"Keep using the chemistry quiz bank from the hub. This section is a map of the 2026 pack so you can revise the same headings your class used.","blocks":[{"heading":"Checklist of ideas","body":["Structure of atoms: protons, neutrons, electrons, electron configuration.","Ions and ionic compounds: metals lose electrons, non-metals gain electrons.","Chemical reactions: reactants → products, conservation of atoms, balancing equations.","Acid reactions, combustion and corrosion, endothermic vs exothermic labs, tests for common ions."]}]},{"id":"reproduction","topic":"reproduction","title":"Reproduction","pack":"September 2026 reproduction pack","sources":["Year 9 Science Practice Test: Reproduction","Reproduction Recap","Reproductive Strategies"],"summary":"Sexual reproduction mixes genes; asexual reproduction copies the parent quickly.","blocks":[{"heading":"Key comparisons","body":["Sexual reproduction uses gametes and fertilisation, producing genetically varied offspring.","Asexual reproduction does not use sex cells; offspring are genetically identical unless a mutation occurs.","Gametes are haploid. Human body cells have 46 chromosomes; gametes have 23. Fertilisation forms a zygote.","Internal fertilisation happens inside the body; external is common in water.","Viviparous: live young. Oviparous: eggs. Ovoviviparous: eggs hatch inside the parent.","Asexual strategies: binary fission, budding, fragmentation, vegetative propagation, spore formation, parthenogenesis."]}]},{"id":"body-regulation","topic":"body","title":"Body regulation","pack":"Nervous and endocrine systems","sources":["2025 NS and Endocrine Revision Checklist.docx","2025 The Nervous System.pptx","2025 Endocrine system.pptx","2025 Nervous System Booklet_.docx"],"summary":"Homeostasis is keeping a constant internal environment, using nervous and hormonal control.","blocks":[{"heading":"From the 2025 pack","body":["The nervous system uses electrical impulses along neurones and chemical messengers (neurotransmitters) at synapses.","Myelin is the fatty insulation around an axon.","The endocrine system uses hormones in the blood — slower but longer lasting.","Negative feedback reverses a change (for example sweating to cool you down). Positive feedback increases a change."]}]},{"id":"carbon-cycle","topic":"carbon","title":"Carbon cycle and Earth's spheres","pack":"Carbon cycle source pack","sources":["4. Carbon Cycle Processes.pptx","1. Earths Spheres 2026.pptx","2. Carbon Basics Worksheet.docx","Photosynthesis and respiration quiz / worksheets"],"summary":"Carbon moves between atmosphere, biosphere, hydrosphere and geosphere by photosynthesis, respiration, combustion and decomposition.","blocks":[{"heading":"Processes","body":["Photosynthesis: carbon dioxide + water → glucose + oxygen (endothermic).","Cellular respiration: glucose + oxygen → carbon dioxide + water + energy (exothermic).","Incomplete combustion can make carbon monoxide and soot.","Lithification turns sediment into sedimentary rock. Decomposition breaks down dead organisms."]}]}],"MATCH_SETS":[{"id":"energy","label":"Energy","pairs":[{"term":"Kinetic energy","def":"Energy of a moving object, Ek = ½mv²"},{"term":"GPE","def":"Stored energy due to height, Ep = mgh"},{"term":"Work","def":"Energy transferred when a force moves an object, W = Fs"},{"term":"Efficiency","def":"Useful energy out ÷ total energy in × 100%"},{"term":"Sankey diagram","def":"Arrow diagram where width shows energy amount"},{"term":"Conservation of energy","def":"Energy cannot be created or destroyed, only transferred"}]},{"id":"light","label":"Light","pairs":[{"term":"Law of reflection","def":"Angle of incidence equals angle of reflection"},{"term":"Normal","def":"A line drawn at 90° to a surface at the point of incidence"},{"term":"Refraction","def":"Bending of light when it changes speed between media"},{"term":"TIR","def":"All light reflects inside a denser medium when i ≥ critical angle"},{"term":"Dispersion","def":"White light splitting into ROYGBIV because colours slow by different amounts"},{"term":"Additive primaries","def":"Red, green and blue light mix to make white"}]},{"id":"emspectrum","label":"EM spectrum","pairs":[{"term":"Radio waves","def":"Longest wavelength EM waves; radio and TV"},{"term":"Microwaves","def":"Heat food by vibrating water molecules; also radar"},{"term":"Infrared","def":"Heat radiation; remotes and thermal cameras"},{"term":"Ultraviolet","def":"Can cause sunburn and skin cancer; also makes vitamin D"},{"term":"X-rays","def":"Pass through soft tissue; used to image bones"},{"term":"Gamma rays","def":"Highest energy EM waves; from radioactive nuclei"}]},{"id":"electricity","label":"Electricity","pairs":[{"term":"Current","def":"Flow of charge, measured in amps"},{"term":"Voltage","def":"Energy per coulomb / push on charges, measured in volts"},{"term":"Resistance","def":"Opposition to current, measured in ohms"},{"term":"Series circuit","def":"One path; current the same everywhere; voltage shared"},{"term":"Parallel circuit","def":"Branches; voltage the same across each; current splits"},{"term":"Ammeter","def":"Measures current and is placed in series"}]},{"id":"radioactivity","label":"Radioactivity","pairs":[{"term":"Isotope","def":"Same number of protons, different number of neutrons"},{"term":"Alpha particle","def":"Helium nucleus; stopped by paper; highly ionising"},{"term":"Beta particle","def":"Fast electron; stopped by aluminium"},{"term":"Gamma ray","def":"EM wave; most penetrating; needs thick lead or concrete"},{"term":"Half-life","def":"Time for half the radioactive nuclei in a sample to decay"},{"term":"Ionising radiation","def":"Radiation that can knock electrons off atoms and damage DNA"}]}]};
  window.CAT_NAMES = {"energy":"Energy & Transformations","heat":"Heat Transfer & Insulation","sound":"Sound & Waves","electricity":"Electricity & Circuits","light":"Light: Reflection, Refraction & Colour","emspectrum":"Electromagnetic Spectrum","radioactivity":"Isotopes & Radioactivity","physics":"Physics: Mixed","reproduction":"Bio: Reproduction","chemistry":"Chem: Atomic Structure & Reactions","carbon":"Earth: Carbon Cycle","body":"Bio: Body Regulation"};
  window.TOPIC_ORDER = ["energy","heat","sound","emspectrum","light","electricity","radioactivity","physics","chemistry","reproduction","body","carbon"];
  </script>
  <script>
(function () {
  const DATA = window.STUDYMATE;
  const qBank = DATA.qBank;
  const notes = DATA.noteSections;
  const MATCH = DATA.MATCH_SETS;
  const names = window.CAT_NAMES;
  const ORDER = window.TOPIC_ORDER;
  const STATS_KEY = "studymate-sciStats";
  const QSTATS_KEY = "studymate-sciQuestionStats";
  const TT_KEY = "studymate-sciTimetable";
  const TABS = [
    ["notes", "Notes"],
    ["quizzes", "Quizzes"],
    ["labs", "Labs"],
    ["games", "Games"],
    ["stats", "Progress"],
    ["calendar", "Planner"],
  ];
  const state = {
    tab: "notes",
    filter: "all",
    noteId: notes[0] && notes[0].id,
    quizTopic: "all",
    quizLen: 10,
    exam: false,
    remain: 0,
    items: [],
    submitted: false,
    lab: null,
    lightMode: "spectrum",
    game: null,
    iDeg: 42,
    nFrom: 1,
    nTo: 1.5,
    refI: 35,
    rgb: [255, 0, 0],
    reflects: { r: true, g: false, b: false },
    nm: 550,
    band: "vis",
    circMode: "series",
    bulbs: 2,
    volts: 12,
    sankeyIn: 100,
    sankeyUse: 40,
    atoms: Array(64).fill(true),
    decaySteps: 0,
    openStat: null,
  };
  let examTimer = null;

  function esc(s) {
    return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&", "<": "<", ">": ">", '"': """, "'": "&#39;" }[c]));
  }
  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }
  function norm(v) {
    return v.toLowerCase().trim().replace(/[^a-z0-9\s]/g, "").replace(/\s+/g, " ");
  }
  function matchAns(user, accepted) {
    const opts = Array.isArray(accepted) ? accepted : [accepted];
    const u = norm(user);
    const singular = (w) => (w.endsWith("s") ? w.slice(0, -1) : w);
    return opts.some((o) => {
      const a = norm(String(o));
      return u === a || singular(u) === singular(a);
    });
  }
  function questionsFor(topic) {
    return topic === "all" ? qBank : qBank.filter((q) => q.cat === topic);
  }
  function readJson(key, fallback) {
    try {
      const raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : fallback;
    } catch {
      return fallback;
    }
  }
  function loadStats() {
    const base = {};
    ORDER.forEach((id) => (base[id] = { c: 0, t: 0 }));
    const stored = readJson(STATS_KEY, {});
    ORDER.forEach((id) => { if (stored[id]) base[id] = stored[id]; });
    return base;
  }
  function saveResults(updates) {
    const stats = loadStats();
    const qStats = readJson(QSTATS_KEY, {});
    updates.forEach((u) => {
      if (!stats[u.cat]) stats[u.cat] = { c: 0, t: 0 };
      stats[u.cat].t += 1;
      if (u.correct) stats[u.cat].c += 1;
      if (!qStats[u.q]) qStats[u.q] = { c: 0, t: 0 };
      qStats[u.q].t += 1;
      if (u.correct) qStats[u.q].c += 1;
    });
    localStorage.setItem(STATS_KEY, JSON.stringify(stats));
    localStorage.setItem(QSTATS_KEY, JSON.stringify(qStats));
  }

  function navHtml() {
    return TABS.map(([id, label]) =>
      '<button class="navbtn' + (state.tab === id ? " on" : "") + '" data-tab="' + id + '">' + label + "</button>"
    ).join("");
  }

  function render() {
    document.getElementById("sidenav").innerHTML = navHtml();
    document.getElementById("topnav").innerHTML = navHtml();
    document.getElementById("counts").textContent = notes.length + " note packs · " + qBank.length + " questions";
    const root = document.getElementById("root");
    if (state.tab === "notes") root.innerHTML = renderNotes();
    else if (state.tab === "quizzes") root.innerHTML = renderQuiz();
    else if (state.tab === "labs") root.innerHTML = renderLabs();
    else if (state.tab === "games") root.innerHTML = renderGames();
    else if (state.tab === "stats") root.innerHTML = renderStats();
    else root.innerHTML = renderCal();
    bind();
  }

  function renderNotes() {
    const visible = state.filter === "all" ? notes : notes.filter((n) => n.topic === state.filter);
    const active = visible.find((n) => n.id === state.noteId) || visible[0];
    if (active) state.noteId = active.id;
    let chips = '<button class="chip' + (state.filter === "all" ? " on" : "") + '" data-filter="all">All packs</button>';
    chips += ORDER.map((id) =>
      '<button class="chip' + (state.filter === id ? " on" : "") + '" data-filter="' + id + '">' + esc(names[id]) + "</button>"
    ).join("");
    const list = visible.map((n) =>
      '<button class="listbtn' + (active && n.id === active.id ? " on" : "") + '" data-note="' + n.id + '"><strong style="color:var(--fg)">' +
      esc(n.title) + "</strong><div style='font-size:12px;margin-top:4px'>" + esc(n.pack) + "</div></button>"
    ).join("");
    let article = "";
    if (active) {
      article = "<p class='kicker' style='color:var(--primary)'>" + esc(names[active.topic]) + "</p>";
      article += "<h2>" + esc(active.title) + "</h2><p class='muted'>" + esc(active.summary) + "</p>";
      (active.blocks || []).forEach((b) => {
        article += "<h3>" + esc(b.heading) + "</h3><ul>" + b.body.map((l) => "<li>" + esc(l) + "</li>").join("") + "</ul>";
      });
      if (active.formulas && active.formulas.length) {
        article += "<h3>Formulas</h3>";
        active.formulas.forEach((f) => {
          article += "<div class='fact'><div class='muted' style='font-size:11px'>" + esc(f.name) + "</div><b>" + esc(f.formula) + "</b>" +
            (f.note ? "<div class='muted' style='font-size:12px'>" + esc(f.note) + "</div>" : "") + "</div>";
        });
      }
      if (active.glossary) {
        article += "<h3>Glossary</h3>";
        active.glossary.forEach((g) => {
          article += "<p><strong style='color:var(--primary)'>" + esc(g.term) + "</strong><br><span class='muted'>" + esc(g.def) + "</span></p>";
        });
      }
      if (["em-spectrum", "visible-light", "reflection", "refraction", "colour"].includes(active.id)) {
        if (active.id === "reflection") state.lightMode = "reflection";
        else if (active.id === "refraction") state.lightMode = "refraction";
        else if (active.id === "colour") state.lightMode = "colour";
        else state.lightMode = "spectrum";
        article += renderLightLab();
      }
      if (active.id === "energy-sankey" || active.id === "energy-work") article += renderSankey();
      if (active.id === "radio-halflife") article += renderDecay();
      if (active.id === "electricity-intro" || active.id === "electricity-circuits") article += renderCircuit();
      article += "<h3 class='muted' style='font-size:12px'>Source files</h3><ul class='muted'>" +
        (active.sources || []).map((s) => "<li>" + esc(s) + "</li>").join("") + "</ul>";
    }
    return "<p class='kicker' style='color:var(--primary)'>Read</p><h2>Study notes</h2><p class='muted'>Each pack matches a Year 9 file.</p>" +
      "<div class='row' style='margin:16px 0;overflow:auto'>" + chips + "</div><div class='notes'><div>" + list + "</div><div>" + article + "</div></div>";
  }

  const BANDS = [
    ["radio", "Radio", "#3a7bd5", "Longest wavelength. Radio, TV, some mobiles."],
    ["micro", "Microwave", "#22d3ee", "Heat food by vibrating water molecules. Radar."],
    ["ir", "Infrared", "#f27a3d", "Heat, remotes, thermal cameras. Hotter objects emit more IR."],
    ["vis", "Visible", "linear-gradient(90deg,#ef4444,#f59e0b,#22c55e,#3b82f6,#8b5cf6)", "The only EM radiation human eyes detect (~390–780 nm)."],
    ["uv", "UV", "#7b6cff", "Vitamin D and sunburn. Fluorescence and security inks."],
    ["x", "X-ray", "#c084fc", "Bone imaging. Lead shielding for radiographers."],
    ["gamma", "Gamma", "#f43f6a", "Highest energy. From radioactive nuclei."],
  ];

  function renderLightLab() {
    const modes = [["spectrum", "Spectrum"], ["reflection", "Reflection"], ["refraction", "Refraction"], ["colour", "Colour"]];
    let out = "<h3>Light lab</h3><div class='row' style='margin:8px 0'>";
    modes.forEach(([id, label]) => {
      out += '<button class="chip' + (state.lightMode === id ? " on" : "") + '" data-light="' + id + '">' + label + "</button>";
    });
    out += "</div>";
    if (state.lightMode === "spectrum") {
      out += "<div class='spec'>";
      BANDS.forEach(([id, label, color]) => {
        out += '<button data-band="' + id + '" style="background:' + color + '">' + label + "</button>";
      });
      out += "</div><p class='muted' style='font-size:12px'>Long λ · low energy → short λ · high energy</p>";
      const band = BANDS.find((b) => b[0] === state.band) || BANDS[3];
      out += "<p class='fact'>" + esc(band[3]) + "</p>";
      out += "<label class='field'>Visible wavelength " + state.nm + " nm<input type='range' min='390' max='700' value='" + state.nm + "' id='nm'></label>";
    } else if (state.lightMode === "reflection") {
      const i = (state.iDeg * Math.PI) / 180;
      const ox = 200, oy = 188, len = 150;
      const ix = ox - Math.sin(i) * len, iy = oy - Math.cos(i) * len;
      const rx = ox + Math.sin(i) * len, ry = oy - Math.cos(i) * len;
      out += '<svg viewBox="0 0 400 240" width="100%" style="background:var(--bg);border-radius:12px;border:1px solid var(--border)">';
      out += '<rect x="24" y="188" width="352" height="10" rx="2" fill="#163044"/>';
      out += '<line x1="200" y1="36" x2="200" y2="188" stroke="#8aa4b5" stroke-dasharray="4 5"/>';
      out += '<line x1="' + ix + '" y1="' + iy + '" x2="' + ox + '" y2="' + oy + '" stroke="#4ec8f0" stroke-width="3"/>';
      out += '<line x1="' + ox + '" y1="' + oy + '" x2="' + rx + '" y2="' + ry + '" stroke="#3dd6a3" stroke-width="3"/>';
      out += '<text x="142" y="130" fill="#4ec8f0" font-size="13">i ' + state.iDeg + '°</text>';
      out += '<text x="228" y="130" fill="#3dd6a3" font-size="13">r ' + state.iDeg + '°</text></svg>';
      out += "<label class='field'>Angle of incidence<input type='range' min='8' max='80' value='" + state.iDeg + "' id='ideg'></label>";
      out += "<p class='fact'><b>i = r = " + state.iDeg + "°</b></p>";
    } else if (state.lightMode === "refraction") {
      const i = (state.refI * Math.PI) / 180;
      const arg = (state.nFrom / state.nTo) * Math.sin(i);
      const tir = arg > 1;
      const r = tir ? i : Math.asin(Math.min(1, arg));
      const rDeg = Math.round((r * 180) / Math.PI);
      out += "<div class='grid2'><label class='field'>From n<input id='nfrom' type='number' step='0.01' value='" + state.nFrom + "'></label>";
      out += "<label class='field'>Into n<input id='nto' type='number' step='0.01' value='" + state.nTo + "'></label></div>";
      out += "<p class='muted'>Air 1.00 · water 1.33 · glass 1.50 · diamond 2.42</p>";
      out += "<label class='field'>Angle of incidence " + state.refI + "°<input type='range' min='1' max='85' value='" + state.refI + "' id='refi'></label>";
      out += "<div class='grid2'><div class='fact'>i<br><b>" + state.refI + "°</b></div><div class='fact'>" + (tir ? "TIR" : "r") + "<br><b>" + (tir ? "reflects" : rDeg + "°") + "</b></div></div>";
      if (tir) out += "<p style='color:var(--warning)'>Total internal reflection — i is past the critical angle.</p>";
      else out += "<p class='muted'>Snell: n₁ sin i = n₂ sin r</p>";
    } else {
      const mix = "rgb(" + state.rgb.join(" ") + ")";
      const obj = "rgb(" + (state.reflects.r ? 220 : 18) + " " + (state.reflects.g ? 220 : 18) + " " + (state.reflects.b ? 220 : 18) + ")";
      out += "<div class='grid2'><div class='card'><strong>Additive mixing (lights)</strong>";
      out += "<div style='height:88px;border-radius:8px;margin:10px 0;border:1px solid var(--border);background:" + mix + "'></div>";
      out += "R " + state.rgb[0] + "<input type='range' min='0' max='255' value='" + state.rgb[0] + "' id='cr'>";
      out += "G " + state.rgb[1] + "<input type='range' min='0' max='255' value='" + state.rgb[1] + "' id='cg'>";
      out += "B " + state.rgb[2] + "<input type='range' min='0' max='255' value='" + state.rgb[2] + "' id='cb'>";
      out += "<div class='row' style='margin-top:8px'><button class='chip' data-preset='255,255,0'>Yellow</button><button class='chip' data-preset='0,255,255'>Cyan</button><button class='chip' data-preset='255,0,255'>Magenta</button><button class='chip' data-preset='255,255,255'>White</button></div></div>";
      out += "<div class='card'><strong>Object colour</strong><p class='muted'>Tick the wavelengths this surface reflects.</p>";
      out += "<div style='height:88px;border-radius:8px;margin:10px 0;border:1px solid var(--border);background:" + obj + "'></div>";
      out += "<label><input type='checkbox' id='rr'" + (state.reflects.r ? " checked" : "") + "> Reflects red</label><br>";
      out += "<label><input type='checkbox' id='rg'" + (state.reflects.g ? " checked" : "") + "> Reflects green</label><br>";
      out += "<label><input type='checkbox' id='rb'" + (state.reflects.b ? " checked" : "") + "> Reflects blue</label></div></div>";
    }
    return out;
  }

  function renderCircuit() {
    const R = 6, n = state.bulbs, V = state.volts;
    const series = state.circMode === "series";
    const I = series ? V / (n * R) : (V / R) * n;
    const Vbulb = series ? I * R : V;
    let out = "<h3>Circuit bench</h3><div class='row'>";
    out += '<button class="chip' + (series ? " on" : "") + '" data-circ="series">Series</button>';
    out += '<button class="chip' + (!series ? " on" : "") + '" data-circ="parallel">Parallel</button></div>';
    out += "<label class='field'>Battery " + V + " V<input type='range' min='3' max='24' value='" + V + "' id='volts'></label>";
    out += "<label class='field'>Lamps " + n + "<input type='range' min='1' max='4' value='" + n + "' id='bulbs'></label>";
    out += "<div class='grid2'><div class='fact'>Supply current<br><b>" + I.toFixed(2) + " A</b></div>";
    out += "<div class='fact'>Voltage on each lamp<br><b>" + Vbulb.toFixed(2) + " V</b></div></div>";
    out += "<p class='muted'>" + (series
      ? "Series: one path, current the same everywhere, voltage shared."
      : "Parallel: each branch gets the full battery voltage. Current splits.") + "</p>";
    return out;
  }

  function renderSankey() {
    const input = state.sankeyIn, useful = Math.min(state.sankeyUse, input);
    const waste = input - useful;
    const eff = input ? (useful / input) * 100 : 0;
    return "<h3>Energy & Sankey</h3><div class='grid2'><label class='field'>Input energy (J)<input type='number' id='sin' value='" + input + "'></label>" +
      "<label class='field'>Useful energy (J)<input type='number' id='suse' value='" + useful + "'></label></div>" +
      "<div class='fact'>Efficiency<br><b>" + eff.toFixed(1) + "%</b> · wasted " + waste + " J</div>" +
      "<p class='muted'>GPE = mgh · KE = ½mv² · Work = F × s · efficiency = useful ÷ input × 100%</p>";
  }

  function renderDecay() {
    const left = state.atoms.filter(Boolean).length;
    const expected = 64 * Math.pow(0.5, state.decaySteps);
    let dots = "<div style='display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin:12px 0'>";
    state.atoms.forEach((a) => {
      dots += "<span style='aspect-ratio:1;border-radius:50%;background:" + (a ? "var(--primary)" : "var(--hover)") + "'></span>";
    });
    dots += "</div>";
    return "<h3>Half-life sample</h3><p class='muted'>Each nucleus has a 50% chance of decaying each half-life.</p>" + dots +
      "<div class='grid2'><div class='fact'>Half-lives<br><b>" + state.decaySteps + "</b></div><div class='fact'>Left<br><b>" + left + " / 64</b></div><div class='fact'>Expected<br><b>" + expected.toFixed(1) + "</b></div></div>" +
      "<button class='btn primary' id='decay'>Advance one half-life</button> <button class='btn' id='decayreset'>Reset</button>";
  }

  function renderLabs() {
    if (!state.lab) {
      const items = [
        ["light", "Light lab", "Spectrum, reflection, refraction, TIR and colour mixing."],
        ["circuit", "Circuit bench", "Series vs parallel. Watch current and voltage split."],
        ["sankey", "Energy & Sankey", "Efficiency split plus the energy formulas."],
        ["decay", "Half-life sample", "Watch 64 nuclei decay vs (1/2)ⁿ."],
      ];
      return "<p class='kicker' style='color:var(--primary)'>Interactive</p><h2>Labs</h2><p class='muted'>Build the picture in your head before the test.</p><div class='grid2'>" +
        items.map(([id, t, b]) => '<button class="card" data-lab="' + id + '"><h3>' + t + "</h3><p class='muted'>" + b + "</p></button>").join("") + "</div>";
    }
    let body = '<button class="btn ghost" data-lab="">← All labs</button>';
    if (state.lab === "light") body += "<h2>Light lab</h2>" + renderLightLab();
    if (state.lab === "circuit") body += "<h2>Circuit bench</h2>" + renderCircuit();
    if (state.lab === "sankey") body += "<h2>Energy & Sankey</h2>" + renderSankey();
    if (state.lab === "decay") body += "<h2>Half-life sample</h2>" + renderDecay();
    return body;
  }

  function renderQuiz() {
    let bar = '<select id="qtopic">';
    bar += '<option value="all"' + (state.quizTopic === "all" ? " selected" : "") + ">Mix all topics (" + qBank.length + ")</option>";
    ORDER.forEach((id) => {
      bar += '<option value="' + id + '"' + (state.quizTopic === id ? " selected" : "") + ">" + esc(names[id]) + "</option>";
    });
    bar += '</select><select id="qlen">';
    [5, 10, 20].forEach((n) => {
      bar += '<option value="' + n + '"' + (state.quizLen === n ? " selected" : "") + ">" + n + " questions</option>";
    });
    bar += '</select><label class="chip" style="height:44px"><input type="checkbox" id="exam"' + (state.exam ? " checked" : "") + "> Exam clock</label>";
    bar += '<button class="btn primary" id="startquiz">Start quiz</button>';
    let body = "<p class='kicker' style='color:var(--primary)'>Test</p><h2>Smart quizzes</h2><p class='muted'>" + qBank.length + " questions. Results save to Progress.</p><div class='row'>" + bar + "</div>";
    if (state.exam && state.items.length && !state.submitted) {
      const m = Math.floor(state.remain / 60);
      const s = String(state.remain % 60).padStart(2, "0");
      body += "<p style='font-family:ui-monospace;color:var(--primary);font-size:1.2rem'>" + m + ":" + s + "</p>";
    }
    if (!state.items.length) body += "<p class='muted' style='margin-top:24px'>Choose a topic and start a quiz.</p>";
    else {
      state.items.forEach((q, i) => {
        const accepted = Array.isArray(q.a) ? q.a[0] : q.a;
        const ok = state.submitted && matchAns(q.userAns || "", q.a);
        body += "<article class='card' style='margin-top:12px'><div class='kicker' style='color:var(--primary)'>" + esc(names[q.cat] || q.cat) + "</div>";
        body += "<p><strong>" + (i + 1) + ". " + esc(q.q) + "</strong></p>";
        if (q.type === "mcq" && q.options) {
          q.options.forEach((opt) => {
            let cls = "mcq";
            if (state.submitted && opt === accepted) cls += " good";
            else if (state.submitted && opt === q.userAns && !ok) cls += " bad";
            else if (q.userAns === opt) cls += " sel";
            body += '<button class="' + cls + '" data-ans="' + i + '" data-opt="' + esc(opt) + '"' + (state.submitted ? " disabled" : "") + ">" + esc(opt) + "</button>";
          });
        } else {
          body += '<input data-typed="' + i + '" placeholder="Type your answer" value="' + esc(q.userAns || "") + '"' + (state.submitted ? " disabled" : "") + ">";
        }
        if (state.submitted && q.answered) {
          body += "<p style='color:" + (ok ? "var(--success)" : "var(--danger)") + "'>" + (ok ? "Correct" : "Accepted: " + esc(accepted)) + "</p>";
        }
        body += "</article>";
      });
      if (!state.submitted) body += '<button class="btn primary" style="width:100%;margin-top:16px" id="submitquiz">Submit answers and save progress</button>';
    }
    return body;
  }

  function startQuiz() {
    const pool = shuffle(questionsFor(state.quizTopic));
    const n = Math.min(state.quizLen, pool.length);
    state.items = pool.slice(0, n).map((q) => ({ ...q, options: q.options ? shuffle(q.options) : q.options, userAns: "", answered: false }));
    state.submitted = false;
    state.remain = state.exam ? (n <= 10 ? 8 * 60 : 15 * 60) : 0;
    if (examTimer) clearInterval(examTimer);
    if (state.exam) {
      examTimer = setInterval(() => {
        state.remain -= 1;
        if (state.remain <= 0) {
          clearInterval(examTimer);
          submitQuiz();
        } else if (state.tab === "quizzes") {
          render();
        }
      }, 1000);
    }
    render();
  }

  function submitQuiz() {
    if (state.submitted) return;
    state.submitted = true;
    if (examTimer) clearInterval(examTimer);
    const updates = state.items.filter((q) => q.answered).map((q) => ({
      cat: q.cat, q: q.q, correct: matchAns(q.userAns || "", q.a),
    }));
    if (updates.length) saveResults(updates);
    render();
  }

  function makeBlitz() {
    const kind = Math.floor(Math.random() * 4);
    const r = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
    if (kind === 0) {
      const m = r(2, 12), h = r(1, 8);
      return { q: "A " + m + " kg mass is lifted " + h + " m. g = 10 N/kg. What is the GPE gained?", a: m * 10 * h, unit: "J", hint: "Ep = mgh" };
    }
    if (kind === 1) {
      const m = r(2, 10), v = r(2, 8);
      return { q: "A " + m + " kg object moves at " + v + " m/s. What is its kinetic energy?", a: 0.5 * m * v * v, unit: "J", hint: "Ek = ½mv²" };
    }
    if (kind === 2) {
      const f = r(5, 20) * 10, s = r(2, 12);
      return { q: "A force of " + f + " N moves an object " + s + " m. How much work is done?", a: f * s, unit: "J", hint: "W = F × s" };
    }
    const input = r(2, 10) * 50, useful = Math.min(r(1, 8) * 20, input);
    return { q: "A device takes in " + input + " J and usefully transfers " + useful + " J. Efficiency as a percentage?", a: (useful / input) * 100, unit: "%", hint: "useful ÷ input × 100" };
  }

  function renderWeak() {

    }).filter((x) => x.t > 0 && (x.rate ?? 1) < 0.75).sort((a, b) => (a.rate ?? 0) - (b.rate ?? 0));
    if (!ranked.length) return "<p class='muted'>No weak spots yet. Sit a quiz or a game first.</p>";
    if (!gameRuntime.weak) gameRuntime.weak = { items: shuffle(ranked.map((r) => r.q)).slice(0, 10), i: 0, score: 0, revealed: false, choice: "" };

    };
    const reshuffle = document.getElementById("reshuffle"); if (reshuffle) reshuffle.onclick = () => {
      gameRuntime.spec = { items: shuffle(["Radio", "Microwave", "Infrared", "Visible", "Ultraviolet", "X-ray", "Gamma"]), checked: false }; render();
    };
    document.querySelectorAll("[data-up]").forEach((el) => el.onclick = () => {
      const i = Number(el.dataset.up); if (i === 0) return;
      const a = gameRuntime.spec.items; [a[i - 1], a[i]] = [a[i], a[i - 1]]; render();
    });
    document.querySelectorAll("[data-down]").forEach((el) => el.onclick = () => {
      const i = Number(el.dataset.down); const a = gameRuntime.spec.items; if (i >= a.length - 1) return;
      [a[i + 1], a[i]] = [a[i], a[i + 1]]; render();
    });
    const dealmatch = document.getElementById("dealmatch"); if (dealmatch) dealmatch.onclick = () => {
      const pack = MATCH.find((p) => p.id === (document.getElementById("matchset").value)) || MATCH[0];
      gameRuntime.match = {
        packId: pack.id,
        left: shuffle(pack.pairs.map((p, i) => ({ id: "t" + i, text: p.term, pair: i }))),
        right: shuffle(pack.pairs.map((p, i) => ({ id: "d" + i, text: p.def, pair: i }))),
        pick: null, matched: [], misses: 0,
      };
      render();
    };
    document.querySelectorAll("[data-match]").forEach((el) => el.onclick = () => {
      const g = gameRuntime.match;
      const all = g.left.concat(g.right);
      const card = all.find((c) => c.id === el.dataset.match);
      if (!g.pick) { g.pick = card; render(); return; }
      if (g.pick.id === card.id) { g.pick = null; render(); return; }
      if (g.pick.pair === card.pair) { g.matched.push(g.pick.id, card.id); g.pick = null; }
      else { g.misses += 1; g.pick = null; }
      render();
    });
    const startrad = document.getElementById("startrad"); if (startrad) startrad.onclick = () => {
      gameRuntime.rad = { queue: shuffle(RAD.slice()), i: 0, score: 0, picked: null }; render();
    };
    document.querySelectorAll("[data-rad]").forEach((el) => el.onclick = () => {
      const g = gameRuntime.rad; if (g.picked) return;
      const cur = g.queue[g.i]; const ok = el.dataset.rad === cur[1];
      g.picked = el.dataset.rad; if (ok) g.score += 1;
      saveResults([{ cat: "radioactivity", q: cur[0], correct: ok }]);
      setTimeout(() => { g.i += 1; g.picked = null; render(); }, 400);
      render();
    });
    const startblitz = document.getElementById("startblitz"); if (startblitz) startblitz.onclick = () => {
      gameRuntime.blitz = { items: Array.from({ length: 8 }, makeBlitz), i: 0, score: 0, typed: "", fb: null }; render();
    };
    const blitzans = document.getElementById("blitzans"); if (blitzans) blitzans.oninput = () => { gameRuntime.blitz.typed = blitzans.value; };
    const checkblitz = document.getElementById("checkblitz"); if (checkblitz) checkblitz.onclick = () => {
      const g = gameRuntime.blitz; const cur = g.items[g.i]; const n = Number(g.typed);
      const ok = Number.isFinite(n) && (Math.abs(n - cur.a) < 0.51 || Math.abs(n - cur.a) / Math.max(1, Math.abs(cur.a)) < 0.02);
      g.fb = ok ? "ok" : "no"; if (ok) g.score += 1;
      saveResults([{ cat: "energy", q: cur.q, correct: ok }]); render();
    };
    const nextblitz = document.getElementById("nextblitz"); if (nextblitz) nextblitz.onclick = () => {
      gameRuntime.blitz.i += 1; gameRuntime.blitz.typed = ""; gameRuntime.blitz.fb = null; render();
    };
    const flashtopic = document.getElementById("flashtopic"); if (flashtopic) flashtopic.onchange = () => { gameRuntime.flash.topic = flashtopic.value; };
    const dealflash = document.getElementById("dealflash"); if (dealflash) dealflash.onclick = () => {
      gameRuntime.flash.cards = shuffle(questionsFor(gameRuntime.flash.topic)).slice(0, 15);
      gameRuntime.flash.i = 0; gameRuntime.flash.show = false; render();
    };
    const flipflash = document.getElementById("flipflash"); if (flipflash) flipflash.onclick = () => { gameRuntime.flash.show = !gameRuntime.flash.show; render(); };
    const nextflash = document.getElementById("nextflash"); if (nextflash) nextflash.onclick = () => {
      const g = gameRuntime.flash; g.i = (g.i + 1) % g.cards.length; g.show = false; render();
    };
    const prevflash = document.getElementById("prevflash"); if (prevflash) prevflash.onclick = () => {
      const g = gameRuntime.flash; g.i = (g.i - 1 + g.cards.length) % g.cards.length; g.show = false; render();
    };
    const startsprint = document.getElementById("startsprint"); if (startsprint) startsprint.onclick = () => {
      const pool = shuffle(questionsFor("all").filter((q) => q.type === "mcq"));
      gameRuntime.sprint = { time: 60, score: 0, streak: 0, active: true, pool, current: pool.pop() };
      const tick = setInterval(() => {
        const g = gameRuntime.sprint;
        g.time -= 1;
        if (g.time <= 0) { g.active = false; g.time = 0; clearInterval(tick); }
        if (state.tab === "games" && state.game === "sprint") render();
      }, 1000);
      render();
    };
    document.querySelectorAll("[data-sprint]").forEach((el) => el.onclick = () => {
      const g = gameRuntime.sprint; if (!g.active || !g.current) return;
      const right = el.dataset.sprint === (Array.isArray(g.current.a) ? g.current.a[0] : g.current.a);
      if (right) { g.score += 1; g.streak += 1; } else g.streak = 0;
      g.current = g.pool.pop() || null;
      render();
    });
    document.querySelectorAll("[data-weak]").forEach((el) => el.onclick = () => {
      const g = gameRuntime.weak; if (g.revealed) return;
      const cur = g.items[g.i];
      g.choice = el.dataset.weak; g.revealed = true;
      const ok = matchAns(g.choice, cur.a);
      if (ok) g.score += 1;
      saveResults([{ cat: cur.cat, q: cur.q, correct: ok }]);
      render();
    });
    const nextweak = document.getElementById("nextweak"); if (nextweak) nextweak.onclick = () => {
      gameRuntime.weak.i += 1; gameRuntime.weak.revealed = false; gameRuntime.weak.choice = ""; render();
    };
    const resetstats = document.getElementById("resetstats"); if (resetstats) resetstats.onclick = () => {
      if (confirm("Reset all progress data?")) {
        localStorage.removeItem(STATS_KEY); localStorage.removeItem(QSTATS_KEY); state.openStat = null; render();
      }
    };
    const addev = document.getElementById("addev"); if (addev) addev.onclick = () => {
      const name = (document.getElementById("evname").value || "").trim();
      const date = document.getElementById("evdate").value;
      const type = document.getElementById("evtype").value;
      if (!name || !date) return;
      const events = readJson(TT_KEY, []);
      events.push({ name, date, type });
      localStorage.setItem(TT_KEY, JSON.stringify(events));
      render();
    };
    document.querySelectorAll("[data-del]").forEach((el) => el.onclick = () => {
      const events = readJson(TT_KEY, []);
      events.splice(Number(el.dataset.del), 1);
      localStorage.setItem(TT_KEY, JSON.stringify(events));
      render();
    });
  }

  render();
})();
  </script>
</body>
</html>
